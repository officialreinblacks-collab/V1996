<html lang="en"><head><meta charset="utf-8">

<style>

<div id="toast" role="status"></div>
<div class="app">
 <div class="main">
  <div class="bar">
   <input id="sym" value="BTCUSDT" aria-label="Symbol" spellcheck="false">
   <span id="tfs"></span>
   <label>Balance<input id="bal" class="n" type="number" value="10000" min="1"></label>

  </div>

 </div>
 <div class="side" id="side"></div>
</div>
<script>
/* tools-5.html - Dealer Levels & Liquidity Sweep analysis tool. Data: Binance public klines (spot). Not financial advice. */
const $=s=>document.querySelector(s),med=a=>{const b=[...a].sort((x,y)=>x-y);return b[b.length>>1]||0};
const fmt=v=>v==null||!isFinite(v)?'—':Math.abs(v)>=1000?v.toLocaleString('en',{maximumFractionDigits:2}):Math.abs(v)>=1?v.toFixed(4):v.toPrecision(4);
const COL={ceil:'#3b82f6',piv:'#a855f7',res:'#ef4444',sup:'#22c55e',stab:'#eab308',trap:'#f97316'};
const NAMES={ceil:'Dealer Ceiling',piv:'Main Reclaim Pivot',res:'Active Dealer Resistance',sup:'Active Dealer Support',stab:'Stabilization Support',trap:'Sweep Trap Zone'};
const S={sym:'BTCUSDT',etf:'5m',show:{ceil:1,piv:1,res:1,sup:1,stab:1,trap:1,liq:1,str:1,sig:1,plan:1}};
try{Object.assign(S.show,JSON.parse(localStorage.getItem('t5show')||'{}'))}catch(e){}
let D={},R=null,lastSt=null;

/* ---------- math helpers ---------- */
function atr(a,n=14){const r=[];let p=0;for(let i=0;i<a.length;i++){const x=a[i],tr=i?Math.max(x.h-x.l,Math.abs(x.h-a[i-1].c),Math.abs(x.l-a[i-1].c)):x.h-x.l;p=i<n?(p*i+tr)/(i+1):(p*(n-1)+tr)/n;r.push(p)}return r}
function ema(a,n){const k=2/(n+1);let e=a[0].c;for(const x of a)e=x.c*k+e*(1-k);return e}
function piv(a,L,R){const o=[];for(let i=L;i<a.length-R;i++){let h=1,l=1;for(let k=1;k<=L;k++){if(a[i-k].h>=a[i].h)h=0;if(a[i-k].l<=a[i].l)l=0}for(let k=1;k<=R;k++){if(a[i+k].h>a[i].h)h=0;if(a[i+k].l<a[i].l)l=0}if(h)o.push({i,p:a[i].h,hi:1});if(l)o.push({i,p:a[i].l,hi:0})}return o}
const mirror=a=>a.map(x=>({t:x.t,o:-x.o,h:-x.l,l:-x.h,c:-x.c,v:x.v}));

/* ---------- market structure: swing pivots, BOS / CHoCH on closes ---------- */
function struct(a,L=3){const p=piv(a,L,L),ev=[];let tr=0,sh=null,sl=null,pi=0;
 for(let i=0;i<a.length;i++){while(pi<p.length&&p[pi].i+L<=i){const q=p[pi++];q.hi?sh={p:q.p,i:q.i,u:0}:sl={p:q.p,i:q.i,u:0}}
  if(sh&&!sh.u&&a[i].c>sh.p){ev.push({i,dir:1,t:tr===1||!tr?'BOS':'CHoCH',lv:sh.p,from:sh.i});sh.u=1;tr=1}
  if(sl&&!sl.u&&a[i].c<sl.p){ev.push({i,dir:-1,t:tr===-1||!tr?'BOS':'CHoCH',lv:sl.p,from:sl.i});sl.u=1;tr=-1}}
 return{ev,tr}}
function trend(a,L){const p=piv(a,L,L),H=p.filter(x=>x.hi).slice(-2),W=p.filter(x=>!x.hi).slice(-2);let s=0;
 if(H.length>1&&W.length>1){if(H[1].p>H[0].p&&W[1].p>W[0].p)s=2;else if(H[1].p<H[0].p&&W[1].p<W[0].p)s=-2}
 s+=a.at(-1).c>ema(a.slice(-120),50)?1:-1;return s>=2?1:s<=-2?-1:0}

/* ---------- 1. dealer levels from clustered swing reactions ---------- */
function levels(D){const a15=D['15m'].cl,a1=D['1h'].cl,a4=D['4h'].cl,tol=atr(a1).at(-1)*.4,pts=[];
 [[a4,'H4',3,4],[a1,'H1',2,5],[a15,'M15',1,4]].forEach(([a,nm,w,L])=>piv(a,L,L).forEach(q=>pts.push({p:q.p,w:w*(.4+.6*q.i/a.length),tf:nm,age:(a.at(-1).t-a[q.i].t)/3600})));
 pts.sort((x,y)=>x.p-y.p);const cs=[];let c=null;
 for(const q of pts){if(c&&q.p-c.last<=tol){c.pts.push(q);c.last=q.p}else{c={pts:[q],last:q.p};cs.push(c)}}
 return cs.map(c=>{const W=c.pts.reduce((s,q)=>s+q.w,0),p=c.pts.reduce((s,q)=>s+q.p*q.w,0)/W;let tc=0;
  a1.slice(-300).forEach(x=>{if((Math.abs(x.h-p)<=tol&&x.c<p)||(Math.abs(x.l-p)<=tol&&x.c>p))tc++});
  const sc=W+.5*Math.min(tc,10),f={};c.pts.forEach(q=>f[q.tf]=(f[q.tf]||0)+1);
  return{p,score:sc,conf:Math.round(100*(1-Math.exp(-sc/8))),why:Object.entries(f).map(e=>e[0]+'×'+e[1]).join(' ')+' swings, '+tc+' H1 reactions, newest swing '+Math.round(Math.min(...c.pts.map(q=>q.age)))+'h ago'}}).filter(c=>c.score>=2.2)}
function dealer(cs,px,D){const A15=atr(D['15m'].cl).at(-1),up=cs.filter(c=>c.p>px).sort((a,b)=>a.p-b.p),dn=cs.filter(c=>c.p<=px).sort((a,b)=>b.p-a.p),L={};
 const mk=(c,t)=>c&&{...c,why:t+' '+c.why};
 L.res=mk(up[0],'Nearest cluster above price.');L.sup=mk(dn[0],'Nearest cluster below price.');
 L.ceil=mk(up.slice(1).sort((a,b)=>b.score-a.score||b.p-a.p)[0],'Strongest cluster above Active Resistance.');
 if(L.res&&L.ceil){const m=up.filter(c=>c.p>L.res.p&&c.p<L.ceil.p).sort((a,b)=>b.score-a.score)[0];
  L.piv=m?mk(m,'Strongest cluster between resistance and ceiling; price must reclaim it to flip bias.'):{p:(L.res.p+L.ceil.p)/2,conf:25,why:'No cluster between resistance and ceiling, so the midpoint is used (low confidence).'}}
 L.stab=mk(dn.slice(1,4).sort((a,b)=>b.score-a.score)[0],'Strongest of the next 3 clusters below Active Support.');
 if(L.res||L.sup){const below=L.sup&&(!L.res||px-L.sup.p<=L.res.p-px);
  L.trap=below?{lo:L.sup.p-.6*A15,hi:L.sup.p,conf:L.sup.conf,why:'Sell-side liquidity band (0.6×M15 ATR) under Active Support: stops rest here; a sweep followed by a reclaim is the buy trap.'}
  :{lo:L.res.p,hi:L.res.p+.6*A15,conf:L.res.conf,why:'Buy-side liquidity band (0.6×M15 ATR) over Active Resistance: stops rest here; a sweep followed by a rejection is the sell trap.'}}
 return L}

/* ---------- 2. market bias ---------- */
function bias(D){const t4=trend(D['4h'].cl,4),t1=trend(D['1h'].cl,5),t15=trend(D['15m'].cl,4),h=D['1h'].cl.slice(-48),A1=atr(D['1h'].cl).at(-1);
 const rng=(Math.max(...h.map(x=>x.h))-Math.min(...h.map(x=>x.l)))/A1,ar=['↓','·','↑'],tx=`H4 ${ar[t4+1]}  H1 ${ar[t1+1]}  M15 ${ar[t15+1]}`;let b,r;
 if(t4&&t4===t1&&t15===t4){b=t4>0?'BULLISH':'BEARISH';r='H4, H1 and M15 structure all agree (HH/HL or LH/LL plus EMA50 side).'}
 else if(t1&&t15===-t1){b='REVERSAL DEVELOPING';r=`M15 structure has turned ${t15>0?'up':'down'} against the H1 ${t1>0?'uptrend':'downtrend'}; needs H1 confirmation.`}
 else if(t1&&(t4===t1||!t4)){b=t1>0?'BULLISH':'BEARISH';r='H1 trend is '+(t1>0?'up':'down')+(t4?' and H4 agrees.':' with H4 neutral.')+' M15 is mixed.'}
 else if(!t1&&rng<5){b='RANGING';r=`H1 structure is flat and the last 48 H1 candles span only ${rng.toFixed(1)} ATR.`}
 else{b='NEUTRAL';r='Timeframes conflict or H1 has no clear structure.'}
 return{b,r,tx,t4,t1,t15}}

/* ---------- 5. liquidity pools and sweeps ---------- */
function liquidity(D,px,A15,a){const pools=[],a15=D['15m'].cl,a1=D['1h'].cl,P=piv(a15.slice(-300),3,3),tol=.15*A15;
 for(const hi of[1,0]){const q=P.filter(x=>x.hi===hi);for(let i=0;i<q.length;i++)for(let j=i+1;j<q.length;j++)if(Math.abs(q[i].p-q[j].p)<=tol){pools.push({k:hi?'EQH':'EQL',p:(q[i].p+q[j].p)/2,hi});break}}
 const day=x=>Math.floor(x.t/86400),d0=day(a1.at(-1))-1,pd=a1.filter(x=>day(x)===d0);
 if(pd.length){pools.push({k:'PDH',p:Math.max(...pd.map(x=>x.h)),hi:1},{k:'PDL',p:Math.min(...pd.map(x=>x.l)),hi:0})}
 const ses=x=>Math.floor(x.t/28800),s0=ses(a1.at(-1))-1,ps=a1.filter(x=>ses(x)===s0);
 if(ps.length){pools.push({k:'PSH',p:Math.max(...ps.map(x=>x.h)),hi:1},{k:'PSL',p:Math.min(...ps.map(x=>x.l)),hi:0})}
 const P1=piv(a1,5,5);for(const hi of[1,0]){const q=P1.filter(x=>x.hi===hi).reverse().find(x=>hi?!a1.slice(x.i+1).some(y=>y.h>x.p):!a1.slice(x.i+1).some(y=>y.l<x.p));if(q)pools.push({k:'SWH/SWL'.split('/')[hi?0:1],p:q.p,hi})}
 const w=a.slice(-200),n=w.length;
 return pools.filter(o=>Math.abs(o.p-px)<=8*A15).map(o=>{o.side=o.hi?'BSL':'SSL';let sw=-1;
  for(let i=n-1;i>=0;i--)if(o.hi?w[i].h>o.p&&w[i].c<o.p:w[i].l<o.p&&w[i].c>o.p){sw=i;break}
  const acc=w.slice(-3).every(x=>o.hi?x.c>o.p:x.c<o.p)&&n>3;
  o.st=acc?'accepted (genuine breakout)':sw>=n-40&&sw>=0?'SWEPT '+(n-1-sw)+' bars ago':'intact';o.swept=!acc&&sw>=n-40&&sw>=0;return o}).sort((x,y)=>y.p-x.p).slice(0,14)}

/* ---------- 3 & 4. setup state machine (written for the SELL frame; BUY uses mirrored candles) ---------- */
function setup(a,lvl,A){const n=a.length,r={};let ti=-1;
 for(let i=n-1;i>=n-40;i--)if(a[i].h>=lvl-.15*A){ti=i;break}
 if(ti<0)return r;let ts=ti;
 for(let i=ti-1;i>=Math.max(0,n-60);i--){if(a[i].h>=lvl-.15*A&&ts-i<=6)ts=i;else if(ts-i>6)break}
 let ext=-Infinity,hx=ts;for(let i=ts;i<n;i++)if(a[i].h>ext){ext=a[i].h;hx=i}
 Object.assign(r,{touch:1,ts,ext,hx,swept:ext>lvl,rej:ti<n-1||a[ti].c<lvl});
 const bd=x=>Math.abs(x.c-x.o),avg=a.slice(Math.max(0,n-21),n-1).reduce((s,x)=>s+bd(x),0)/20||1e-9;
 for(let j=hx;j<n;j++){const x=a[j];if(x.c<x.o&&x.c<lvl&&bd(x)>=1.3*avg){r.disp=j;r.dr=bd(x)/avg;break}}
 const e=struct(a).ev.find(e=>e.dir<0&&e.i>hx&&e.i>=ts);
 if(e){r.ev=e;for(let k=e.i+1;k<Math.min(n,e.i+7);k++)if(a[k].c<a[k].o&&a[k].c<e.lv){r.k=k;break}
  for(let m=e.i+1;m<n;m++)if(a[m].h>=e.lv-.25*A&&a[m].c<e.lv){r.m=m;break}
  if(r.k!=null){r.si=Math.max(r.k,r.m==null?r.k:r.m);r.entry=a[r.si].c;r.sl=ext+.1*A;r.inv=a.slice(r.si+1).some(x=>x.h>r.sl)}}
 return r}
function targets(dir,en,cs,L){if(dir>0){const u=cs.filter(c=>c.p>en).sort((a,b)=>a.p-b.p).map(c=>c.p),t1=u[0],t2=L.piv&&L.piv.p>t1?L.piv.p:u.find(p=>p>t1);
  return[t1,t2,L.ceil&&L.ceil.p>t2?L.ceil.p:u.find(p=>p>t2)]}
 const d=cs.filter(c=>c.p<en).sort((a,b)=>b.p-a.p).map(c=>c.p),t1=d[0],t2=d.find(p=>p<t1);return[t1,t2,L.stab&&L.stab.p<t2?L.stab.p:d.find(p=>p<t2)]}

/* ---------- 6. breakout / reclaim scenarios ---------- */
function scen(a,cs,px,A15,Ae){const out=[],n=a.length,s=Math.max(1,n-40);
 cs.filter(c=>Math.abs(c.p-px)<=3*A15).sort((x,y)=>Math.abs(x.p-px)-Math.abs(y.p-px)).slice(0,4).forEach(c=>{const L=c.p;let k=-1,d=0;
  for(let i=n-1;i>=s;i--){const u=a[i].c>L&&a[i-1].c<=L,w=a[i].c<L&&a[i-1].c>=L;if(u||w){k=i;d=u?1:-1;break}}
  if(k<0)return;const af=a.slice(k+1),big=Math.abs(a[k].c-a[k].o)>=.7*Ae,cur=a[n-1].c,fresh=n-1-k<=20;
  if(d>0&&cur>L){const rt=af.some(y=>y.l<=L+.25*Ae&&y.c>L);out.push({t:'BULLISH BREAKOUT',L,ok:big&&rt,s:big?(rt?'closed above with momentum, retest held as support':'closed above with momentum, waiting for retest'):'closed above on weak momentum, unconfirmed'})}
  else if(d>0&&fresh)out.push({t:'BEARISH RECLAIM FAILURE',L,ok:1,s:'broke above, then closed back below'});
  else if(d<0&&cur<L){const rt=af.some(y=>y.h>=L-.25*Ae&&y.c<L);out.push({t:'BEARISH BREAKDOWN',L,ok:big&&rt,s:big?(rt?'closed below with displacement, retest failed':'closed below with displacement, waiting for retest'):'closed below on weak momentum, unconfirmed'})}
  else if(d<0&&fresh)out.push({t:'BULLISH RECLAIM',L,ok:0,s:'broke below, then closed back above; needs structure confirmation'})});
 return out}

/* ---------- master analysis ---------- */
function analyze(){const E=D[S.etf],a=E.cl,px=E.all.at(-1).c,Ae=atr(a).at(-1),A15=atr(D['15m'].cl).at(-1);
 const cs=levels(D),L=dealer(cs,px,D),B=bias(D),str=struct(a),liq=liquidity(D,px,A15,a),sc=scen(a,cs,px,A15,Ae);
 const bal=+$('#bal').value||0,rk=+$('#risk').value||1,minRR=+$('#rr').value||2,cand=[];
 if(L.res)cand.push({dir:-1,lv:L.res.p,r:setup(a,L.res.p,Ae),nm:'SELL at Active Dealer Resistance'});
 if(L.sup){const r=setup(mirror(a),-L.sup.p,Ae);['ext','sl','entry'].forEach(k=>r[k]!=null&&(r[k]=-r[k]));if(r.ev)r.ev={...r.ev,lv:-r.ev.lv};cand.push({dir:1,lv:L.sup.p,r,nm:'BUY at Active Dealer Support'})}
 const pr=c=>[c.r.touch,c.r.swept,c.r.rej,c.r.disp!=null,c.r.ev,c.r.k!=null].filter(Boolean).length;
 cand.sort((x,y)=>pr(y)-pr(x)||Math.abs(px-x.lv)-Math.abs(px-y.lv));const C=cand[0]||null,r=C?C.r:{};
 const A={px,Ae,A15,cs,L,B,str,liq,sc,C,r,bal,rk,minRR,status:'WAITING',block:[],plan:null,grade:null};
 const near=Math.min(L.res?L.res.p-px:1e18,L.sup?px-L.sup.p:1e18);
 if(near<=1.5*A15)A.status='APPROACHING LEVEL';
 const vr=Ae/(med(atr(a).slice(-100))||Ae),spike=a.slice(-3).some(x=>x.h-x.l>3.2*Ae);A.vr=vr;
 A.vol=vr>2.5||spike?'EXTREME':vr>1.8?'HIGH':vr<.45?'DEAD':'NORMAL';
 if(C&&r.touch){A.status=r.swept&&!r.ev?'LIQUIDITY SWEEP':'CONFIRMATION REQUIRED';
  if(r.k!=null){const en=r.entry,sl=r.sl,risk=Math.abs(en-sl),tp=targets(C.dir,en,cs,L),rrOf=t=>t?Math.abs(t-en)/risk:null,rr=[rrOf(tp[0]),rrOf(tp[1]),rrOf(tp[2])],gate=rr[1]!=null?rr[1]:rr[0];
   const dist=Math.abs(px-en)/Ae,qty=risk>0?bal*rk/100/risk:0;
   A.plan={dir:C.dir,en,sl,tp,rr,risk,qty,notional:qty*en,dist};
   if(r.inv){A.status='SETUP INVALIDATED';A.block.push('price traded through the stop level after the signal')}
   else{if(!r.rej)A.block.push('no rejection back through the level');if(r.disp==null)A.block.push('no displacement candle');
    if(gate==null||gate<minRR)A.block.push(`RR ${gate==null?'n/a':'1:'+gate.toFixed(2)} (TP2 basis) is below the minimum 1:${minRR}`);
    if(A.vol==='EXTREME')A.block.push('volatility is extreme');if(A.vol==='DEAD')A.block.push('market is too quiet / low quality');
    if(dist>.8)A.block.push(`price is ${dist.toFixed(1)} ATR away from the entry zone, entry has passed`);}
   const S10=[],add=(n,v,t)=>S10.push({n,v:Math.max(0,Math.min(10,v)),t}),al=C.dir*(B.b==='BULLISH'?1:B.b==='BEARISH'?-1:0);
   add('HTF trend alignment',B.b==='REVERSAL DEVELOPING'?(C.dir===B.t15?6:2):B.b==='BULLISH'||B.b==='BEARISH'?(al>0?10:0):5,B.b);
   add('Liquidity sweep',r.swept?10:5,r.swept?'level swept':'touch only');add('Market structure shift',r.ev?(r.ev.t==='CHoCH'?10:8):0,r.ev?r.ev.t:'none');
   add('Displacement',r.dr?r.dr*4:0,r.dr?r.dr.toFixed(1)+'× avg body':'none');add('Confirmation candle',r.k!=null?10:0,r.k!=null?'closed beyond break':'none');
   add('Retest quality',r.m!=null?10:5,r.m!=null?'retest held':'no retest (market entry)');
   add('Distance to target',(Math.abs((tp[0]||en)-en)/Ae)*4,((Math.abs((tp[0]||en)-en)/Ae)).toFixed(1)+' ATR to TP1');
   add('Risk-to-reward',gate==null?0:gate/3*10,gate==null?'n/a':'1:'+gate.toFixed(2));
   add('Volatility',A.vol==='NORMAL'?(vr<1.3?10:7):A.vol==='HIGH'?4:0,A.vol+' ('+vr.toFixed(2)+'× norm)');
   const opp=cs.filter(c=>C.dir>0?(c.p>en&&c.p<en+risk):(c.p<en&&c.p>en-risk)).reduce((m,c)=>Math.max(m,c.score),0);add('Nearby opposing levels',10-opp*1.5,opp?'level within 1R':'clear path for 1R');
   const tot=Math.round(S10.reduce((s,x)=>s+x.v,0)),g=tot>=85?'A+':tot>=70?'A':tot>=55?'B':'C';A.grade={tot,g,S10};
   if(!A.block.length&&g==='C')A.block.push('setup quality is C (weak): avoid or wait');
   if(!r.inv&&A.block.length)A.status=A.block.every(b=>b.includes('entry has passed'))?'WAITING':'CONFIRMATION REQUIRED';
   else if(!r.inv)A.status=C.dir>0?'BUY CONFIRMED':'SELL CONFIRMED'}}
 return A}

/* ---------- data ---------- */
async function load(tf){const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${S.sym}&interval=${tf}&limit=500`);if(!r.ok)throw new Error(tf+' HTTP '+r.status);
 const all=(await r.json()).map(k=>({t:k[0]/1e3,o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));D[tf]={all,cl:all.slice(0,-1)}}
async function refresh(full){try{await Promise.all((full?['4h','1h','15m','5m','1m']:[S.etf]).map(load));$('#err').textContent='';R=analyze();render();alerts()}
 catch(e){$('#err').textContent='Could not load or analyze '+S.sym+': '+e.message+'. Check the symbol (Binance spot, e.g. BTCUSDT) and your connection.'}}

/* ---------- alerts ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',9000);
 if(window.Notification&&Notification.permission==='granted')try{new Notification('Dealer Levels',{body:m})}catch(e){}}
function alerts(){const s=R.status;if(lastSt!==null&&s!==lastSt&&/CONFIRMED|INVALIDATED|LIQUIDITY SWEEP/.test(s))toast(`${S.sym} ${S.etf}: ${s}`+(R.plan?` @ ${fmt(R.plan.en)}`:''));lastSt=s}

/* ---------- panel ---------- */
const kv=(k,v)=>`<span>${k}</span><span>${v}</span>`;
function steps(A){const r=A.r,C=A.C,k=(ok,t)=>`<div class="${ok?'ok':'no'}">${ok?'✓':'○'} ${t}</div>`;
 return k(r.touch,'1. Price reaches or sweeps the level')+k(r.rej,'2. Rejection / reclaim of the level')+k(r.disp!=null,'3. Displacement candle')+k(r.ev,'4. BOS or CHoCH '+(r.ev?'('+r.ev.t+')':''))+k(r.k!=null,'5. Confirmation candle')+k(r.m!=null,'6. Retest (optional)')}
function analysisText(A){const{L,B,C,r,plan:p,grade:g}=A,lv=k=>L[k]?fmt(L[k].p):'—',E=D[S.etf].cl.length,e=A.str.ev.at(-1);
 const liq=A.liq.filter(o=>o.swept||Math.abs(o.p-A.px)<3*A.A15).slice(0,6).map(o=>`${o.k} ${fmt(o.p)} ${o.st}`).join('; ')||'no pools near price';
 const side=C?(C.dir>0?'BUY':'SELL'):'';let scn='Price is between levels; wait for it to reach Active Support or Resistance.';
 if(C&&r.touch)scn=r.k!=null?`${side} setup confirmed on structure; manage it from the entry zone.`:`Price has reached ${C.dir>0?'support':'resistance'}${r.swept?' and swept liquidity':''}; a ${C.dir>0?'bullish':'bearish'} structure break is still needed.`;
 else if(C&&A.status==='APPROACHING LEVEL')scn=`Price is approaching ${C.dir>0?'Active Dealer Support':'Active Dealer Resistance'} ${fmt(C.lv)}; watch for a sweep and rejection.`;
 const tp=p?p.tp:[];
 return `MARKET BIAS: ${B.b}. ${B.r}
KEY LEVELS: Ceiling ${lv('ceil')} | Pivot ${lv('piv')} | Resistance ${lv('res')} | Support ${lv('sup')} | Stabilization ${lv('stab')}${L.trap?` | Trap ${fmt(L.trap.lo)}-${fmt(L.trap.hi)}`:''}
LIQUIDITY: ${liq}
CURRENT STRUCTURE: ${S.etf} ${A.str.tr>0?'bullish':A.str.tr<0?'bearish':'undefined'}${e?`; last ${e.t} ${e.dir>0?'up':'down'} at ${fmt(e.lv)}, ${E-1-e.i} bars ago`:''}
POTENTIAL SCENARIO: ${scn}
ENTRY CONDITIONS: ${C?C.nm+' needs: rejection, displacement, BOS/CHoCH, confirmation candle':'n/a'}
ENTRY ZONE: ${p?fmt(p.en):'not defined until confirmation'}
STOP-LOSS: ${p?fmt(p.sl):'—'}
TAKE PROFIT 1: ${tp[0]?fmt(tp[0]):'—'}
TAKE PROFIT 2: ${tp[1]?fmt(tp[1]):'—'}
TAKE PROFIT 3: ${tp[2]?fmt(tp[2]):'—'}
RISK-TO-REWARD: ${p?p.rr.map((x,i)=>x?`TP${i+1} 1:${x.toFixed(2)}`:'').filter(Boolean).join(' | '):'—'}
SETUP RATING: ${g?g.g+' ('+g.tot+'/100)':'not rated yet'}
INVALIDATION: ${p?`${p.dir>0?'Close/trade below':'Trade above'} ${fmt(p.sl)} (${p.dir>0?'sweep low':'sweep high'} + 0.1 ATR)`:(C?`${C.dir>0?'Clean acceptance below':'Clean acceptance above'} ${fmt(C.lv)}`:'—')}
REASON TO WAIT: ${A.block.length?A.block.join('; '):A.status.includes('CONFIRMED')?'None. All confirmation conditions are met; entry only inside the entry zone.':'Confirmation not complete: '+A.status.toLowerCase()}`}
function render(){const A=R,{L,B,C,r,plan:p,grade:g}=A,cls=/BUY C/.test(A.status)?'buy':/SELL C/.test(A.status)?'sell':/INVAL/.test(A.status)?'inv':'';
 const lvRow=k=>{const o=L[k],c=o?(o.conf||0):0;return `<div class="lv"><i class="dot" style="background:${COL[k]}"></i><label><input type="checkbox" data-k="${k}" ${S.show[k]?'checked':''}> ${NAMES[k]}</label><span>${o?(k==='trap'?fmt(o.lo)+'–'+fmt(o.hi):fmt(o.p)):'—'}</span><span class="sm">${o?c+'%':''}</span></div>`};
 const tg=(k,t)=>`<label style="margin-right:10px"><input type="checkbox" data-k="${k}" ${S.show[k]?'checked':''}> ${t}</label>`;
 const warn=[];if(A.vol==='HIGH'||A.vol==='EXTREME')warn.push('High volatility: '+A.vr.toFixed(2)+'× normal ATR.');if(A.rk>1)warn.push('Risk above the default 0.5-1% range.');if(p&&p.notional>A.bal)warn.push('Position notional exceeds balance, so leverage is needed.');
 $('#side').innerHTML=`<div class="st ${cls}">${A.status}</div>
 <div class="card"><h3>Signal panel</h3><div class="kv">${kv('Price',fmt(A.px))}${kv('Market bias',B.b)}${kv('Trend',B.tx)}${kv('Nearest resistance',fmt(L.res&&L.res.p))}${kv('Nearest support',fmt(L.sup&&L.sup.p))}
 ${kv('Liquidity sweep',A.liq.some(o=>o.swept)?A.liq.filter(o=>o.swept).map(o=>o.k).join(', '):'none')}${kv('BOS/CHoCH',A.str.ev.length?A.str.ev.at(-1).t+' '+(A.str.ev.at(-1).dir>0?'up':'down'):'none')}
 ${kv('Entry',p?fmt(p.en):'—')}${kv('Stop-loss',p?fmt(p.sl):'—')}${kv('TP1 / TP2 / TP3',p?p.tp.map(fmt).join(' / '):'—')}${kv('Risk-to-reward',p?p.rr.map(x=>x?'1:'+x.toFixed(1):'—').join(' / '):'—')}
 ${kv('Setup confidence',g?g.g+' · '+g.tot+'/100':'—')}${kv('Position size',p?p.qty.toPrecision(4)+' units ('+fmt(p.notional)+' notional)':'—')}${kv('Volatility',A.vol+' ('+A.vr.toFixed(2)+'×)')}</div>
 ${warn.map(w=>`<div class="wr" style="margin-top:6px">⚠ ${w}</div>`).join('')}</div>
 <div class="card"><h3>Dealer levels</h3>${['ceil','piv','res','sup','stab','trap'].map(lvRow).join('')}<div style="margin-top:6px">${tg('liq','Liquidity')}${tg('str','BOS/CHoCH')}${tg('sig','Signals')}${tg('plan','Trade plan')}</div>
 <details style="margin-top:6px"><summary>How each level was calculated</summary>${['ceil','piv','res','sup','stab','trap'].map(k=>L[k]?`<p class="sm"><b style="color:${COL[k]}">${NAMES[k]}</b> (${L[k].conf}% confidence): ${L[k].why}</p>`:'').join('')}
 <p class="sm">Method: swing pivots on H4 (weight 3), H1 (2) and M15 (1), newer swings weighted higher, clustered within 0.4×H1 ATR; each cluster gains score from H1 reactions (wick through the level, close back). Confidence = 100×(1−e^(−score/8)). Clusters under score 2.2 are ignored.</p></details></div>
 <div class="card"><h3>${C?C.nm:'Setup'}: checklist</h3>${steps(A)}${A.block.length?`<div class="wr" style="margin-top:6px">${A.block.join('<br>')}</div>`:''}</div>
 <div class="card"><h3>Breakouts and reclaims</h3>${A.sc.length?A.sc.map(s=>`<div><b>${s.t}</b> at ${fmt(s.L)}<div class="sm">${s.s}</div></div>`).join(''):'<span class="sm">No level crossed in the last 40 candles.</span>'}</div>
 <div class="card"><h3>Liquidity</h3>${A.liq.map(o=>`<div class="lv" style="grid-template-columns:48px 1fr auto"><b>${o.k}</b><span class="sm">${o.side} · ${o.st}</span><span>${fmt(o.p)}</span></div>`).join('')||'<span class="sm">No pools near price.</span>'}<div class="sm">PD = previous UTC day, PS = previous 8h UTC session, SWH/SWL = unswept H1 swing.</div></div>
 <div class="card"><h3>Quality score${g?': '+g.g:''}</h3>${g?g.S10.map(x=>`<div class="lv" style="grid-template-columns:1fr 60px auto"><span>${x.n}<span class="sm"> · ${x.t}</span></span><div class="bd"><i style="width:${x.v*10}%;background:${x.v>=7?'var(--grn)':x.v>=4?'var(--yel)':'var(--red)'}"></i></div><span>${x.v.toFixed(0)}</span></div>`).join('')+'<div class="sm">A+ ≥85, A ≥70, B ≥55, C below. A score is a checklist, not a win rate.</div>':'<span class="sm">Scored once a setup is confirmed.</span>'}</div>
 <div class="card"><h3>Final analysis</h3><pre>${analysisText(A)}</pre></div>
 <div class="sm">Analysis tool only. No win rates are claimed and no trade is guaranteed. The RR gate uses TP2 (or TP1 if TP2 is missing).</div>`;
 draw()}

/* ---------- chart ---------- */
function draw(){const cv=$('#cv'),W=cv.clientWidth,H=cv.clientHeight,dp=devicePixelRatio||1;cv.width=W*dp;cv.height=H*dp;const g=cv.getContext('2d');g.setTransform(dp,0,0,dp,0,0);if(!R||!D[S.etf])return;
 const all=D[S.etf].all,N=Math.min(+$('#nb').value,all.length),off=all.length-N,v=all.slice(off),PR=150,PT=22,PB=8,cw=(W-PR)/N;
 let lo=Math.min(...v.map(x=>x.l)),hi=Math.max(...v.map(x=>x.h));const pd=(hi-lo)*.08;lo-=pd;hi+=pd;
 const Y=p=>PT+(hi-p)/(hi-lo)*(H-PT-PB),X=i=>(i-off)*cw+cw/2,inR=p=>p>lo&&p<hi,lab=[];g.font='11px system-ui';
 g.strokeStyle='#161d29';g.fillStyle='#778399';g.lineWidth=1;for(let i=0;i<=5;i++){const p=lo+(hi-lo)*i/5,y=Y(p);g.beginPath();g.moveTo(0,y);g.lineTo(W-PR,y);g.stroke();g.fillText(fmt(p),W-PR+4,y-2)}
 const{L}=R,line=(p,c,t,d)=>{if(p==null||!inR(p))return;g.strokeStyle=c;g.lineWidth=1.2;g.setLineDash(d||[]);g.beginPath();g.moveTo(0,Y(p));g.lineTo(W-PR,Y(p));g.stroke();g.setLineDash([]);lab.push({y:Y(p),c,t})};
 if(S.show.trap&&L.trap&&inR(L.trap.hi)){g.fillStyle='rgba(249,115,22,.16)';g.fillRect(0,Y(L.trap.hi),W-PR,Math.max(2,Y(L.trap.lo)-Y(L.trap.hi)));lab.push({y:Y((L.trap.hi+L.trap.lo)/2),c:COL.trap,t:'Sweep Trap Zone'})}
 ['ceil','piv','res','sup','stab'].forEach(k=>S.show[k]&&L[k]&&line(L[k].p,COL[k],NAMES[k]+' '+fmt(L[k].p),k==='piv'||k==='stab'?[6,4]:null));
 if(S.show.liq)R.liq.forEach(o=>line(o.p,o.swept?'#f97316':'#4b5568',o.k+(o.swept?' swept':''),[2,4]));
 v.forEach((x,j)=>{const i=off+j,xx=X(i),up=x.c>=x.o,c=up?'#22c55e':'#ef4444';g.strokeStyle=g.fillStyle=c;g.lineWidth=1;g.beginPath();g.moveTo(xx,Y(x.h));g.lineTo(xx,Y(x.l));g.stroke();g.fillRect(xx-cw*.35,Math.min(Y(x.o),Y(x.c)),cw*.7,Math.max(1,Math.abs(Y(x.o)-Y(x.c))))});
 if(S.show.str)R.str.ev.slice(-6).forEach(e=>{if(e.i<off||e.from<off-80)return;const y=Y(e.lv);if(!inR(e.lv))return;g.strokeStyle='#cbd5e1';g.setLineDash([3,3]);g.beginPath();g.moveTo(X(Math.max(e.from,off)),y);g.lineTo(X(e.i),y);g.stroke();g.setLineDash([]);g.fillStyle='#cbd5e1';g.fillText(e.t,X(e.i)-14,y+(e.dir>0?-4:12))});
 const p=R.plan;if(S.show.plan&&p&&!/INVAL/.test(R.status)){line(p.en,'#e5e7eb','Entry '+fmt(p.en),[4,3]);line(p.sl,'#ef4444','SL '+fmt(p.sl),[4,3]);p.tp.forEach((t,i)=>t&&line(t,'#4ade80','TP'+(i+1)+' '+fmt(t),[4,3]))}
 if(S.show.sig&&p&&R.r.si!=null&&R.r.si>=off){const x=all[R.r.si],xx=X(R.r.si),b=p.dir>0,y=b?Y(x.l)+8:Y(x.h)-8;g.fillStyle=b?'#22c55e':'#ef4444';g.beginPath();g.moveTo(xx,y);g.lineTo(xx-7,y+(b?14:-14));g.lineTo(xx+7,y+(b?14:-14));g.fill();g.fillText(b?'BUY':'SELL',xx-12,y+(b?26:-18))}
 lab.sort((a,b)=>a.y-b.y);for(let i=1;i<lab.length;i++)if(lab[i].y-lab[i-1].y<13)lab[i].y=lab[i-1].y+13;
 lab.forEach(l=>{g.font='10px system-ui';const w=Math.min(PR-2,g.measureText(l.t).width+8);g.fillStyle=l.c;g.globalAlpha=.9;g.fillRect(W-PR+1,l.y-7,w,13);g.globalAlpha=1;g.fillStyle='#0a0d13';g.fillText(l.t,W-PR+5,l.y+3)});
 g.font='12px system-ui';g.fillStyle='#d6dce8';g.fillText(`${S.sym} · ${S.etf.toUpperCase()} · ${fmt(R.px)} · ${R.B.b}`,8,14)}

/* ---------- wiring ---------- */
$('#tfs').innerHTML=['1m','5m','15m','1h'].map(t=>`<button data-tf="${t}" class="${t===S.etf?'on':''}">${t.toUpperCase()}</button>`).join(' ');
$('#tfs').onclick=e=>{const t=e.target.dataset.tf;if(!t)return;S.etf=t;document.querySelectorAll('[data-tf]').forEach(b=>b.classList.toggle('on',b.dataset.tf===t));lastSt=null;refresh(false)};
$('#side').onchange=e=>{const k=e.target.dataset.k;if(!k)return;S.show[k]=e.target.checked?1:0;try{localStorage.setItem('t5show',JSON.stringify(S.show))}catch(x){}draw()};
$('#sym').onchange=e=>{const v=e.target.value.trim().toUpperCase();if(/^[A-Z0-9]{5,15}$/.test(v)){S.sym=v;lastSt=null;refresh(true)}else $('#err').textContent='Enter a Binance spot symbol such as BTCUSDT.'};
['bal','risk','rr'].forEach(i=>$('#'+i).onchange=()=>{if(D['4h']){R=analyze();render()}});$('#nb').oninput=draw;
$('#al').onclick=()=>{if(window.Notification)Notification.requestPermission().then(p=>toast(p==='granted'?'Alerts on. They fire while this page is open.':'Browser alerts blocked; in-page alerts still show.'));else toast('In-page alerts are on.')};
try{if(parent!==window){document.body.classList.add('emb');parent.postMessage({type:'dlr-ready'},'*')}}catch(e){}
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='dlr-sym'&&/^[A-Z0-9]{5,15}$/.test(String(d.sym||'').toUpperCase())&&String(d.sym).toUpperCase()!==S.sym){S.sym=String(d.sym).toUpperCase();$('#sym').value=S.sym;lastSt=null;refresh(true)}});
addEventListener('resize',draw);refresh(true);setInterval(()=>refresh(false),10000);setInterval(()=>refresh(true),90000);
</script></body></html>
