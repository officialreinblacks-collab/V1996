<script type="text/plain" id="mpvT10">
// ===================================================================================================
// MarketPlusView tool code  -  tool10.html  -  loaded by index.html, run INSIDE the app (direct eval in start()).
// [ivi] INDICATOR: ICT - GAPS, Volume & Price Imbalances  (port of the Pine v6 script by Vulnerable_human_x, MPL 2.0)
// Draws: Volume Imbalances (Classic / Advanced), True GAPs or GAP + Inefficiency, FVG (Normal / Liquidity Void),
// Implied FVG and Inverse FVG, each with C.E. line, mitigation (Engulf / Mitigate / Rebalance), box limits,
// highlight when price is inside a box and grey mitigated boxes. Guide: Script2.html#ivi
// ===================================================================================================
try{
const IV_DEF={
  viType:'Classic', viBull:'#00e640', viBear:'#e30000', viTr:90, viMax:8, viMit:'Engulf', viExt:true, viExtAll:false,
  gapType:'True GAP', gapCol:'#4ec1f7', gapTr:90, gapMax:7, gapCE:true, gapStyle:'Dashed', gapMit:'Engulf', gapExt:true,
  fvgType:'Normal', showImp:false, showInv:false, fvgBull:'#4caf50', fvgBear:'#f23645', impBull:'#4caf50', impBear:'#f23645',
  invBull:'#fbc02d', invBear:'#fbc02d', fvgTr:90, invTr:94, fvgMax:15, invMax:4, fvgMit:'Engulf', impMit:'Engulf',
  fvgCE:true, ceStyle:'Dashed', ceTr:50, fvgExt:true,
  bStyle:'Solid', bTr:85, hl:true, hlBg:80, hlBd:67, lbl:true, lblSize:'Tiny', lblCol:'#a1a3ab', hAlign:'Center', vAlign:'Middle',
  mitOn:true, mitCol:'#787b86', mitTr:92, mitLblTr:88
};
const ivRgba=(hex,tr)=>{ const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); const a=Math.max(0,Math.min(1,1-(+tr||0)/100)); if(!m) return 'rgba(128,128,128,'+a+')'; const n=parseInt(m[1],16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'; };
const ivDash=s=>s==='Dotted'?[1.5,3]:s==='Dashed'?[5,4]:[];

// ---------------------------------------------------------------- engine (closed candles, one pass, nothing repaints)
function ivCompute(c,p){
  const n=c.length, Z=[];
  const G={viBu:[],viBe:[],gpBu:[],gpBe:[],fvBu:[],fvBe:[],ifBu:[],ifBe:[],inBu:[],inBe:[]};
  if(n<4) return {Z:Z,n:n};
  const O=i=>c[i].open, H=i=>c[i].high, L=i=>c[i].low, C=i=>c[i].close;
  const mx=i=>Math.max(O(i),C(i)), mn=i=>Math.min(O(i),C(i)), body=i=>Math.abs(C(i)-O(i));
  const viOn=p.viType==='Classic'||p.viType==='Advanced', viAdv=p.viType==='Advanced';
  const trueGap=p.gapType==='True GAP', gapImb=p.gapType==='GAP + Inefficiency';
  const fvNorm=p.fvgType==='Normal', lv=p.fvgType==='Liquidity Void', inv=!!p.showInv;
  const fvgGen=fvNorm||(inv&&!lv), fvgHide=!fvNorm&&!lv&&inv;
  const mk=(k,d,l,top,bot,lab,r,c0,ce,hid)=>({k:k,d:d,l:l,top:Math.max(top,bot),bot:Math.min(top,bot),lab:lab,r:r,c0:c0,ce:!!ce,hid:!!hid,mit:-1,tc:false,dead:false});
  const add=(g,lim,z)=>{ if(g.length>lim){ const o=g.shift(); o.dead=true; } g.push(z); Z.push(z); };
  const rm=(g,z)=>{ const i=g.indexOf(z); if(i>=0) g.splice(i,1); z.dead=true; };
  const up=i=>i>=2&&L(i)>H(i-2)&&L(i-1)<=H(i-2)&&H(i-1)>=L(i);
  const dn=i=>i>=2&&H(i)<L(i-2)&&H(i)>=L(i-1)&&H(i-1)>=L(i-2);
  const ifu=t=>t>=2&&H(t)>H(t-2)&&L(t-2)<L(t)&&L(t)<=H(t-2)&&H(t-2)-mx(t-2)>body(t-2)/2&&mn(t)-L(t)>body(t)/2&&L(t)>L(t-1)&&(H(t-2)+mx(t-2))/2<(mn(t)+L(t))/2&&H(t)>H(t-1)&&C(t-1)>O(t-1);
  const ife=t=>t>=2&&L(t)<L(t-2)&&H(t-2)>H(t)&&H(t)>=L(t-2)&&mn(t-2)-L(t-2)>body(t-2)/2&&H(t)-mx(t)>body(t)/2&&H(t)<H(t-1)&&(mn(t-2)+L(t-2))/2>(H(t)+mx(t))/2&&L(t)<L(t-1)&&C(t-1)<O(t-1);
  for(let t=1;t<n;t++){
    const o=O(t),h=H(t),l=L(t),cc=C(t), o1=O(t-1),c1=C(t-1),h1=H(t-1),l1=L(t-1);
    // ---- Volume Imbalance
    if(viOn){
      const vi=(d,top,bot)=>add(d>0?G.viBu:G.viBe,p.viMax,mk('vi',d,t-1,top,bot,d>0?'VI+':'VI-',t+1,t+1,false));
      if(o>c1&&l<=h1&&cc>o&&c1>o1) vi(1,o,c1);
      if(o<c1&&h>=l1&&cc<o&&c1<o1) vi(-1,c1,o);
      if(viAdv){
        if(o<c1&&cc>o&&c1>o1&&h>=l1) vi(1,c1,o);
        if(o>c1&&cc<o&&c1<o1&&l<=h1) vi(-1,o,c1);
        if(o!==c1&&cc>o&&c1<o1&&h>=l1&&l<=h1) vi(1,Math.max(o,c1),Math.min(o,c1));
        if(o!==c1&&cc<o&&c1>o1&&l<=h1&&h>=l1) vi(-1,Math.min(o,c1),Math.max(o,c1));
      }
    }
    // ---- GAP
    if(trueGap||gapImb){
      const gp=(d,top,bot)=>add(d>0?G.gpBu:G.gpBe,p.gapMax,mk('gap',d,t-1,top,bot,d>0?'GAP+':'GAP-',t+1,t+1,p.gapCE));
      if(h1<l) gp(1,trueGap?l:o,trueGap?h1:c1);
      else if(l1>h) gp(-1,trueGap?l1:c1,trueGap?h:o);
    }
    // ---- FVG
    if(fvgGen){
      if(up(t)) add(G.fvBu,p.fvgMax,mk('fvg',1,t-2,l,H(t-2),'FVG+',t,t,p.fvgCE,fvgHide));
      if(dn(t)) add(G.fvBe,p.fvgMax,mk('fvg',-1,t-2,L(t-2),h,'FVG-',t,t,p.fvgCE,fvgHide));
    }
    if(lv&&t>=3){
      if(up(t)&&up(t-1)&&G.fvBu.length>0){ const old=G.fvBu.pop(); old.dead=true; add(G.fvBu,p.fvgMax,mk('fvg',1,old.l,l,old.bot,'LV+',t,t,p.fvgCE,false)); }
      else if(up(t)&&!up(t-1)) add(G.fvBu,p.fvgMax,mk('fvg',1,t-2,l,H(t-2),'FVG+',t,t,p.fvgCE,false));
      if(dn(t)&&dn(t-1)&&G.fvBe.length>0){ const old=G.fvBe.pop(); old.dead=true; add(G.fvBe,p.fvgMax,mk('fvg',-1,old.l,old.top,h,'LV-',t,t,p.fvgCE,false)); }
      else if(dn(t)&&!dn(t-1)) add(G.fvBe,p.fvgMax,mk('fvg',-1,t-2,L(t-2),h,'FVG-',t,t,p.fvgCE,false));
    }
    // ---- Implied FVG
    if(p.showImp){
      if(ifu(t)) add(G.ifBu,p.fvgMax,mk('ifvg',1,t-2,(mn(t)+l)/2,(H(t-2)+mx(t-2))/2,'Imp.FVG+',t+1,t+1,false));
      if(ife(t)) add(G.ifBe,p.fvgMax,mk('ifvg',-1,t-2,(mn(t-2)+L(t-2))/2,(mx(t)+h)/2,'Imp.FVG-',t+1,t+1,false));
    }
    // ---------------- extension / mitigation for bar t
    if(p.fvgExt){
      // implied FVG
      [G.ifBu,G.ifBe].forEach(g=>g.forEach(z=>{ if(z.mit>=0||z.dead||t<z.c0) return; let ok;
        if(p.impMit==='Engulf'){ ok=z.d>0?(cc>=z.bot&&o>=z.bot):(cc<=z.top&&o<=z.top); if(ok&&p.hl&&(z.d>0?l<z.top:h>z.bot)) z.tc=true; }
        else ok=z.d>0?l>=z.top:h<=z.bot;
        if(ok) z.r=t+1; else z.mit=t; }));
      // FVG / liquidity void
      [G.fvBu,G.fvBe].forEach(g=>g.slice().forEach(z=>{ if(z.mit>=0||z.dead||t<z.c0) return; const m=p.fvgMit;
        if(m==='Engulf'){
          const ok=z.d>0?cc>=z.bot:cc<=z.top;
          if(ok){ z.r=t+1; if(p.hl&&(z.d>0?l<z.top:h>z.bot)) z.tc=true; }
          else if(inv){ rm(g,z); const q=mk('inv',-z.d,z.l,z.top,z.bot,z.d>0?'I.FVG-':'I.FVG+',t,t,z.ce,false); add(q.d>0?G.inBu:G.inBe,p.invMax,q); }
          else z.mit=t;
        } else if(m==='Mitigate'){
          const ok=z.d>0?l>=z.top:h<=z.bot; if(ok) z.r=t+1; else z.mit=t;
        } else {
          if(z.d>0){ if(l>=z.top) z.r=t+1; else if(l<z.top&&l>z.bot){ z.top=l; z.r=t+1; if(p.hl) z.tc=true; } else z.mit=t; }
          else { if(h<=z.bot) z.r=t+1; else if(h>z.bot&&h<z.top){ z.bot=h; z.r=t+1; if(p.hl) z.tc=true; } else z.mit=t; }
        } }));
    }
    // inverse FVG boxes: live while price keeps respecting them, deleted the moment it closes through
    [G.inBu,G.inBe].forEach(g=>g.slice().forEach(z=>{ if(z.dead) return;
      if(z.d>0){ if(cc>=z.bot){ z.r=t+1; z.tc=!!(p.hl&&l<z.top); } else rm(g,z); }
      else { if(cc<=z.top){ z.r=t+1; z.tc=!!(p.hl&&h>z.bot); } else rm(g,z); } }));
    // volume imbalance
    if(p.viExtAll){ [G.viBu,G.viBe].forEach(g=>g.forEach(z=>{ if(!z.dead) z.r=t+1; })); }
    else if(p.viExt){
      [G.viBu,G.viBe].forEach(g=>g.forEach(z=>{ if(z.mit>=0||z.dead||t<z.c0) return; let ok;
        if(p.viMit==='Engulf'){ ok=z.d>0?cc>=z.bot:cc<=z.top; if(ok&&p.hl&&(z.d>0?l<z.top:h>z.bot)) z.tc=true; }
        else ok=z.d>0?l>z.top:h<z.top;
        if(ok) z.r=t+1; else z.mit=t; }));
    }
    // gaps
    if(p.gapExt){
      [G.gpBu,G.gpBe].forEach(g=>g.forEach(z=>{ if(z.mit>=0||z.dead||t<z.c0) return;
        if(p.gapMit==='Engulf'){
          const ok=z.d>0?(cc>=z.bot&&o>=z.bot):(cc<=z.top&&o<=z.top);
          if(ok){ z.r=t+1; if(p.hl&&(z.d>0?l<z.top:h>z.bot)) z.tc=true; } else z.mit=t;
        } else {
          if(z.d>0){ if(l>=z.top) z.r=t+1; else if(l<z.top&&l>z.bot){ z.top=l; z.r=t+1; if(p.hl) z.tc=true; } else z.mit=t; }
          else { if(h<=z.bot) z.r=t+1; else if(h>z.bot&&h<z.top){ z.bot=h; z.r=t+1; if(p.hl) z.tc=true; } else z.mit=t; }
        } }));
    }
  }
  return {Z:Z.filter(z=>!z.dead&&!z.hid), n:n};
}
let ivKey='', ivVal=null;
function ivGet(c,p){
  const n=c.length, k=n+'|'+(n?c[n-1].close+'|'+c[n-1].high+'|'+c[n-1].low+'|'+c[0].open:'')+'|'+JSON.stringify(p);
  if(k!==ivKey){ ivKey=k; try{ ivVal=ivCompute(c,p); }catch(e){ console.error('ivi compute',e); ivVal={Z:[],n:n}; } }
  return ivVal;
}

// ---------------------------------------------------------------- registration
IND.ivi={label:'ICT \u00b7 GAPS, Volume & Price Imbalances [VHX]',cat:'Trend',nm:()=>'ICT Imbalances [VHX]',p:Object.assign({},IV_DEF),cols:['#4ec1f7'],
  fields:[
    ['viType','sel','Volume Imbalance type',{opts:['None','Classic','Advanced']}],['viBull','col','Bullish VI color'],['viBear','col','Bearish VI color'],['viTr','num','VI fill transparency %',{min:0,max:100}],
    ['viMax','num','VI max boxes',{min:1,max:100}],['viMit','sel','VI mitigation',{opts:['Engulf','Mitigate']}],['viExt','chk','Extend unmitigated VI boxes'],['viExtAll','chk','Extend all VI boxes'],
    ['gapType','sel','GAP type',{opts:['None','True GAP','GAP + Inefficiency']}],['gapCol','col','GAP color'],['gapTr','num','GAP fill transparency %',{min:0,max:100}],['gapMax','num','GAP max boxes',{min:1,max:100}],
    ['gapCE','chk','GAP Consequent Encroachment (C.E.)'],['gapStyle','sel','GAP C.E. line style',{opts:['Dashed','Dotted','Solid']}],['gapMit','sel','GAP mitigation',{opts:['Engulf','Rebalance']}],['gapExt','chk','Extend unmitigated GAP boxes'],
    ['fvgType','sel','FVG type',{opts:['None','Normal','Liquidity Void']}],['showImp','chk','Implied FVG'],['showInv','chk','Inverse FVG (needs FVG mitigation = Engulf)'],
    ['fvgBull','col','Bullish FVG'],['fvgBear','col','Bearish FVG'],['impBull','col','Bullish implied FVG'],['impBear','col','Bearish implied FVG'],['invBull','col','Bullish inverse FVG'],['invBear','col','Bearish inverse FVG'],
    ['fvgTr','num','FVG fill transparency %',{min:0,max:100}],['invTr','num','Inverse FVG fill transparency %',{min:0,max:100}],['fvgMax','num','FVG / implied FVG max boxes',{min:1,max:100}],['invMax','num','Inverse FVG max boxes',{min:1,max:100}],
    ['fvgMit','sel','FVG / LV mitigation',{opts:['Engulf','Mitigate','Rebalance']}],['impMit','sel','Implied FVG mitigation',{opts:['Engulf','Mitigate']}],
    ['fvgCE','chk','FVG Consequent Encroachment (C.E.)'],['ceStyle','sel','FVG C.E. line style',{opts:['Dashed','Dotted','Solid']}],['ceTr','num','C.E. transparency %',{min:0,max:100}],['fvgExt','chk','Extend all unmitigated FVG boxes'],
    ['bStyle','sel','Box border style',{opts:['Solid','Dashed','Dotted']}],['bTr','num','Border transparency %',{min:0,max:100}],
    ['hl','chk','Highlight box when price is inside it'],['hlBg','num','Highlight fill transparency %',{min:0,max:100}],['hlBd','num','Highlight border transparency %',{min:0,max:100}],
    ['lbl','chk','Show labels'],['lblSize','sel','Label size',{opts:['Tiny','Small','Normal','Large','Huge']}],['lblCol','col','Label color'],
    ['hAlign','sel','Label horizontal align',{opts:['Center','Left','Right']}],['vAlign','sel','Label vertical align',{opts:['Middle','Top','Bottom']}],
    ['mitOn','chk','Grey out mitigated boxes'],['mitCol','col','Mitigated box color'],['mitTr','num','Mitigated transparency %',{min:0,max:100}],['mitLblTr','num','Mitigated label transparency %',{min:0,max:100}]],
  calc:(c,p)=>[[]],
  extras:(c,p)=>{ const q=Object.assign({},IV_DEF,p); const cl=c.length>4?c.slice(0,-1):c; /* closed candles only: the forming candle is left out so boxes never flicker mid-bar */ return {mk:[],boxes:[{type:'iviview',pts:[],o:q,D:ivGet(cl,q)}],labels:[]}; }};

{ const _D=draw; draw=function(d,X,Y,W,H){ if(!d||d.type!=='iviview') return _D.apply(this,arguments);
    const p=d.o, D=d.D, n0=candles.length; if(!D||!D.Z||!D.Z.length||n0<4) return;
    cx.save(); cx.beginPath(); cx.rect(0,0,W,H); cx.clip(); cx.textBaseline='middle'; cx.lineWidth=1;

    const bdash=ivDash(p.bStyle);
    D.Z.forEach(z=>{
      const x0=X(z.l), x1=X(z.r), y0=Y(z.top), y1=Y(z.bot); if(x0==null||x1==null||y0==null||y1==null) return;
      if(x1<-5||x0>W+5) return;
      const bx=Math.min(x0,x1), bw=Math.max(2,Math.abs(x1-x0)), by=Math.min(y0,y1), bh=Math.max(1,Math.abs(y1-y0));

      let fill,bord,txt,ceC;
      if(mit){ fill=ivRgba(p.mitCol,p.mitTr); bord=fill; txt=ivRgba(p.lblCol,p.mitLblTr); ceC=fill; }
      else if(z.tc){ fill=ivRgba(base,p.hlBg); bord=ivRgba(base,p.hlBd); txt=ivRgba(p.lblCol,0); ceC=ivRgba(base,p.ceTr); }
      else { fill=ivRgba(base,ftr); bord=ivRgba(base,p.bTr); txt=ivRgba(p.lblCol,0); ceC=ivRgba(base,p.ceTr); }

    });

  ].join('\n'),

const TPZ_TZ=['America/New_York','America/Chicago','America/Los_Angeles','Europe/London','Europe/Berlin','Asia/Dubai','Asia/Kolkata','Asia/Singapore','Asia/Tokyo','Australia/Sydney','UTC','Chart time zone','Device time'];
const TPZ_HIDE=['Off','1m','5m','15m','30m','1h','4h','1D'], TPZ_HIDES=[0,60,300,900,1800,3600,14400,86400];
// the 17 built-in TradingView colours (silver = default when no colour is typed)
const TPZ_COL={aqua:'#00bcd4',black:'#363a45',blue:'#2962ff',fuchsia:'#e040fb',gray:'#787b86',grey:'#787b86',green:'#4caf50',lime:'#00e676',maroon:'#880e4f',navy:'#311b92',olive:'#808000',orange:'#ff9800',purple:'#9c27b0',red:'#f23645',silver:'#b2b5be',teal:'#089981',white:'#ffffff',yellow:'#fdd835'};
const tpzRgba=(hex,a)=>{ let h=String(hex||'').replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; if(!/^[0-9a-f]{6}$/i.test(h)) h='b2b5be'; const n=parseInt(h,16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+Math.max(0,Math.min(1,a))+')'; };

function tpzTz(s){ if(!s||String(s).indexOf('Chart')===0){ let z='UTC'; try{ z=(window.mpXO&&window.mpXO.XO&&window.mpXO.XO.tz)||'UTC'; }catch(e){} return z; } return s==='Device time'?'local':s; }

  if(Object.keys(tpzOC).length>30000){ for(const x in tpzOC) delete tpzOC[x]; }
  const tt=b*3600; let off=0;
  if(tz==='local') off=-new Date(tt*1000).getTimezoneOffset();
  else if(tz!=='UTC'){ let f=tpzFm[tz]; if(f===undefined){ try{ f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}); }catch(e){ f=null; } tpzFm[tz]=f; }
    if(f){ const q={}; f.formatToParts(new Date(tt*1000)).forEach(x=>{ q[x.type]=+x.value; }); off=Math.round(Date.UTC(q.year,q.month-1,q.day,q.hour%24,q.minute)/60000-tt/60); } }
  return (tpzOC[k]=off); }
function tpzIv(c){ let m=0; for(let i=c.length-1;i>0&&i>c.length-40;i--){ const d=c[i].time-c[i-1].time; if(d>0&&(m===0||d<m)) m=d; } return m; }

// ---------------------------------------------------------------- the instruction reader
function tpzCustom(s){ const o={}; String(s||'').split(/[,;\n]+/).forEach(x=>{ const m=/^\s*([A-Za-z][\w-]*)\s*=\s*(#?[0-9a-fA-F]{3}|#?[0-9a-fA-F]{6})\s*$/.exec(x); if(m){ const h=m[2][0]==='#'?m[2]:'#'+m[2]; o[m[1].toLowerCase()]=h; } }); return o; }
function tpzParse(raw,ign,cust){
  const s=String(raw||'').trim(); if(!s) return null; if(ign&&s.indexOf(ign)===0) return null;
  const low=s.toLowerCase(), times=[], re=/(^|[^\w.:])(\d{1,2})(?::(\d{2}))?(?![\w.:%])/g; let m;
  while((m=re.exec(low))){ const h=+m[2], mi=m[3]==null?0:+m[3]; if(h>23||mi>59) return {err:'time must be 0-23 hours and 0-59 minutes'}; times.push(h*60+mi); }
  if(!times.length) return {err:'a time is required (example 9:30)'};
  const W=low.match(/[a-z][a-z0-9_-]*/g)||[], has=w=>W.indexOf(w)>=0, any=a=>a.some(has);
  const comps=[]; ['open','high','low','close'].forEach(k=>{ if(has(k)) comps.push(k); });
  if(!comps.length&&times.length>1&&(any(['zone','zones','orb'])||any(['extend','extended','extending','extension']))){ comps.push('high','low'); }   // 'purple extended zone' = high/low box of that window
  let col=null; for(let i=0;i<W.length&&!col;i++){ if(cust[W[i]]) col=cust[W[i]]; else if(TPZ_COL[W[i]]) col=TPZ_COL[W[i]]; }
  const dash=has('dotted')?'dotted':has('dashed')?'dashed':'solid';
  const lw=any(['thick','thicker'])?3:has('medium')?2:1;
  const fill=any(['shade','shaded','shading','fill','filled','filling','zone','box']);
  return {t0:times[0],t1:times.length>1?times[1]:null,comps:comps,col:col||TPZ_COL.silver,dash:dash,lw:lw,fill:fill,ext:any(['extend','extended','extending','extension']),track:any(['track','tracks','tracking'])};
}

// ---------------------------------------------------------------- engine: turns the instructions into simple shapes
function tpzCompute(c,p){
  const n=c.length, out={items:[],warn:[]};
  if(n<3) return out;
  const iv=tpzIv(c); if(!(iv>0)||iv>=86400) return out;               // daily and higher candles: nothing to place by time of day
  const hs=TPZ_HIDES[Math.max(0,TPZ_HIDE.indexOf(p.hideAbove))]; if(hs>0&&iv>hs) return out;   // Hide Above
  const tz=tpzTz(p.tz), ivM=iv/60;
  const lm=new Array(n); for(let i=0;i<n;i++) lm[i]=Math.floor(c[i].time/60)+tpzOff(tz,c[i].time);
  const lmLast=lm[n-1], lastDay=Math.floor(lmLast/1440);
  const K=Math.max(1,Math.round(+p.showDays)||5);
  const days=[]; for(let i=n-1;i>=0&&days.length<K;i--){ const d=Math.floor(lm[i]/1440); if(days[days.length-1]!==d) days.push(d); }
  const firstShown=days[days.length-1];
  const adv=Math.max(0,+p.adv||0)*60;
  const lb=x=>{ let lo=0,hi=n; while(lo<hi){ const m=(lo+hi)>>1; if(lm[m]<x) lo=m+1; else hi=m; } return lo; };
  // time -> chart position (candle index, may be fractional or beyond the last candle)
  const posOf=LM=>{ if(LM>lmLast) return n-1+(LM-lmLast)/ivM; const i=lb(LM); if(i>=n) return null;
    if(lm[i]===LM) return i; if(i===0) return null; const d=lm[i]-lm[i-1]; if(d>ivM*1.5) return (lm[i]-LM<=ivM)?i:null; return i-1+(LM-lm[i-1])/d; };
  // right end of "until the end of the trading day"
  // a session break (gap between candles bigger than 1.5 candles and 30 min) ends the trading day early, like futures/stocks sessions; 24h markets end at midnight
  const dayEnd=(day,from)=>{ const e=(day+1)*1440, j=lb(e)-1; if(j<0) return null;
    const gapMin=Math.max(ivM*1.5,30); let k=(from!=null&&from>=0)?from:lb(day*1440); if(k<0) k=0;
    for(;k<j&&k<n-1;k++){ if(lm[k+1]-lm[k]>gapMin&&lm[k]>=day*1440) return k+0.5; }
    if(day<lastDay) return j+0.5;
    if(day>lastDay) return null;
    if(adv>0){ const t=Math.min(e,lmLast+adv); return Math.max(n-0.5,n-1+(t-lmLast)/ivM-0.5); }
    return n-0.5; };
  const cust=tpzCustom(p.cust), ign=String(p.ign==null?'#':p.ign).slice(0,2);
  const fa=1-Math.max(0,Math.min(100,+p.fillTr))/100;
  const lines=String(p.script||'').split(/\r?\n/), maxD=lastDay+(adv>0?Math.ceil(adv/1440):0);
  lines.forEach((raw,li)=>{
    const sp=tpzParse(raw,ign,cust); if(!sp) return;
    if(sp.err){ if(out.warn.length<4) out.warn.push('Line '+(li+1)+': '+sp.err); return; }
    for(let D=firstShown-1;D<=maxD;D++){
      const sLM=D*1440+sp.t0; let eLM=null; if(sp.t1!=null){ eLM=D*1440+sp.t1; if(sp.t1<=sp.t0) eLM+=1440; }
      if((eLM!=null?eLM:sLM+1)<=firstShown*1440) continue;     // older than the days to show
      if(sLM>lmLast+adv) continue;                              // starts further ahead than "show next hours in advance"
      if(eLM!=null&&eLM<=lm[0]) continue;
      const cm=sp.comps, oneAt=(eLM==null);
      // ---------- A) no price word: vertical line(s), shaded band between two times
      if(!cm.length){
        const x0=posOf(sLM); if(x0==null) continue;
        out.items.push({k:'v',x:x0,col:sp.col,lw:sp.lw,dash:sp.dash});
        if(!oneAt){ let eq=eLM, noEnd=false; if(eq>lmLast+adv&&eq>lmLast){ eq=Math.max(lmLast,lmLast+adv); noEnd=true; }
          const x1=posOf(eq); if(x1!=null){ if(!noEnd) out.items.push({k:'v',x:x1,col:sp.col,lw:sp.lw,dash:sp.dash}); if(sp.fill&&x1>x0) out.items.push({k:'band',x0:x0,x1:x1,col:sp.col,a:fa}); } }
        continue; }
      // ---------- B) two times + price words: a zone (or one level) over the window
      if(!oneAt){
        const a=lb(sLM), b=lb(eLM)-1; if(a>=n||a>b||lm[a]>=eLM) continue;
        let hi=-Infinity, lo=Infinity; for(let i=a;i<=b;i++){ if(c[i].high>hi) hi=c[i].high; if(c[i].low<lo) lo=c[i].low; }
        let xL=a-0.5, xR=b+0.5;
        if(eLM>lmLast&&adv>0){ const t=Math.min(eLM,lmLast+adv); xR=Math.max(xR,n-1+(t-lmLast)/ivM-0.5); }
        if(sp.ext){ const de=dayEnd(Math.floor((eLM-1)/1440),b); if(de!=null) xR=Math.max(xR,de); }
        if(sp.track){ const lines2={}; cm.forEach(k=>{ const pts=[]; let rh=-Infinity, rl=Infinity, prev=null;
            for(let i=a;i<=b;i++){ rh=Math.max(rh,c[i].high); rl=Math.min(rl,c[i].low); const v=k==='high'?rh:k==='low'?rl:k==='open'?c[a].open:c[i].close;
              if(prev!=null&&prev!==v) pts.push([i-0.5,prev],[i-0.5,v]); else if(prev==null) pts.push([i-0.5,v]); pts.push([i+0.5,v]); prev=v; }
            if(prev!=null) pts.push([xR,prev]); out.items.push({k:'path',pts:pts,col:sp.col,lw:sp.lw,dash:sp.dash}); }); continue; }
        const vals=cm.map(k=>k==='open'?c[a].open:k==='close'?c[b].close:k==='high'?hi:lo);
        if(vals.length>=2) out.items.push({k:'rect',x0:xL,x1:xR,top:Math.max.apply(null,vals),bot:Math.min.apply(null,vals),col:sp.col,lw:sp.lw,dash:sp.dash,a:sp.fill?fa:0});
        else out.items.push({k:'h',x0:xL,x1:xR,y:vals[0],col:sp.col,lw:sp.lw,dash:sp.dash});
        continue; }
      // ---------- C) one time + price words: line(s) from that candle to the end of the trading day
      { const a=lb(sLM); if(a>=n||lm[a]<D*1440||lm[a]>=(D+1)*1440) continue;
        let xR=dayEnd(D,a); if(xR==null) continue; xR=Math.max(xR,a+0.5);
        if(sp.track){ const jEnd=Math.min(n-1,lb((D+1)*1440)-1);
          cm.forEach(k=>{ const pts=[]; let rh=-Infinity, rl=Infinity, prev=null;
            for(let i=a;i<=jEnd;i++){ rh=Math.max(rh,c[i].high); rl=Math.min(rl,c[i].low); const v=k==='high'?rh:k==='low'?rl:k==='open'?c[a].open:c[i].close;
              if(prev!=null&&prev!==v) pts.push([i-0.5,prev],[i-0.5,v]); else if(prev==null) pts.push([i-0.5,v]); pts.push([i+0.5,v]); prev=v; }
            if(prev!=null) pts.push([xR,prev]); out.items.push({k:'path',pts:pts,col:sp.col,lw:sp.lw,dash:sp.dash}); });
        } else cm.forEach(k=>{ out.items.push({k:'h',x0:a-0.5,x1:xR,y:c[a][k],col:sp.col,lw:sp.lw,dash:sp.dash}); }); }
    }
  });
  return out;
}
let tpzKey='', tpzVal=null;
function tpzGet(c,p){
  const n=c.length, k=n+'|'+(n?c[0].time+'|'+c[n-1].time+'|'+c[n-1].close+'|'+c[n-1].high+'|'+c[n-1].low:'')+'|'+tpzTz(p.tz)+'|'+JSON.stringify(p);
  if(k!==tpzKey){ tpzKey=k; try{ tpzVal=tpzCompute(c,p); }catch(e){ console.error('tpz compute',e); tpzVal={items:[],warn:['Calculation error: '+(e&&e.message)]}; } }
  return tpzVal;
}

// ---------------------------------------------------------------- registration
IND.tpz={label:'Time and Price Lines and Zones',cat:'Trend',nm:()=>'Time & Price Lines and Zones',p:Object.assign({},TPZ_DEF),cols:['#b2b5be'],
  fields:[
    ['tz','sel','Time zone of the times you type',{opts:TPZ_TZ}],
    ['ign','txt','Ignore lines that start with (default #)'],
    ['cust','txt','Your own colors (name=#hex, comma separated)'],
    ['showDays','num','Show last X days',{min:1,max:60}],
    ['adv','num','Show next area hours in advance',{min:0,max:72}],
    ['hideAbove','sel','Hide above timeframe',{opts:TPZ_HIDE}],
    ['fillTr','num','Fill transparency %',{min:0,max:100}]],
  inputsTab:function(b,d){
    const p=d.p, lab=document.createElement('div'); lab.style.cssText='margin:4px 0 10px';
    const sp=document.createElement('div'); sp.style.cssText='font-size:13px;margin-bottom:6px'; sp.textContent='Type your instructions, one per line. A line that starts with # is ignored.'; lab.appendChild(sp);
    const ta=document.createElement('textarea'); ta.value=p.script||''; ta.rows=12; ta.spellcheck=false; ta.autocapitalize='off'; ta.setAttribute('autocorrect','off');
    ta.style.cssText='width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid #3a4258;background:#0f1320;color:#e9edf5;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical';
    ta.oninput=()=>{ p.script=ta.value; }; lab.appendChild(ta); b.appendChild(lab);
    IND.tpz.fields.forEach(f=>fld(b,p,f[0],f[1],f[2],f[3])); },
  calc:(c,p)=>[[]],
  extras:(c,p)=>{ const q=Object.assign({},TPZ_DEF,p); return {mk:[],boxes:[{type:'tpzview',pts:[],o:q,D:tpzGet(c,q)}],labels:[]}; }};
try{ if(typeof DESC!=='undefined'&&DESC&&!DESC.tpz) DESC.tpz='Type plain-English instructions (times, open/high/low/close, colors, shade, extend) and it plots the lines and zones'; }catch(e){}

{ const _D=draw; draw=function(d,X,Y,W,H){ if(!d||d.type!=='tpzview') return _D.apply(this,arguments);
    const D=d.D; if(!D) return;
    cx.save(); cx.beginPath(); cx.rect(0,0,W,H); cx.clip();
    const dsh=(s,lw)=>s==='dotted'?[Math.max(1,lw),3+lw]:s==='dashed'?[6+lw*2,4+lw]:[];
    const stroke=(col,lw,s)=>{ cx.strokeStyle=col; cx.lineWidth=lw; cx.setLineDash(dsh(s,lw)); cx.stroke(); cx.setLineDash([]); };
    D.items.forEach(it=>{
      if(it.k==='v'){ const x=X(it.x); if(x==null||x<-2||x>W+2) return; const xs=it.lw%2?Math.round(x)+.5:Math.round(x); cx.beginPath(); cx.moveTo(xs,0); cx.lineTo(xs,H); stroke(it.col,it.lw,it.dash); }
      else if(it.k==='band'){ const x0=X(it.x0), x1=X(it.x1); if(x0==null||x1==null||x1<0||x0>W) return; cx.fillStyle=tpzRgba(it.col,it.a); cx.fillRect(x0,0,Math.max(1,x1-x0),H); }
      else if(it.k==='h'){ const x0=X(it.x0), x1=X(it.x1), y=Y(it.y); if(x0==null||x1==null||y==null||x1<0||x0>W) return; const ys=it.lw%2?Math.round(y)+.5:Math.round(y); cx.beginPath(); cx.moveTo(x0,ys); cx.lineTo(x1,ys); stroke(it.col,it.lw,it.dash); }
      else if(it.k==='rect'){ const x0=X(it.x0), x1=X(it.x1), y0=Y(it.top), y1=Y(it.bot); if(x0==null||x1==null||y0==null||y1==null||x1<0||x0>W) return;
        const bx=Math.min(x0,x1), bw=Math.max(2,Math.abs(x1-x0)), by=Math.min(y0,y1), bh=Math.max(1,Math.abs(y1-y0));
        if(it.a>0){ cx.fillStyle=tpzRgba(it.col,it.a); cx.fillRect(bx,by,bw,bh); cx.beginPath(); cx.rect(bx+.5,by+.5,Math.max(1,bw-1),Math.max(0,bh-1)); stroke(it.col,it.lw,it.dash); }
        else { cx.beginPath(); cx.rect(bx+.5,by+.5,Math.max(1,bw-1),Math.max(0,bh-1)); stroke(it.col,it.lw,it.dash); } }
      else if(it.k==='path'){ cx.beginPath(); let st=false, any=false; it.pts.forEach(q=>{ const x=X(q[0]), y=Y(q[1]); if(x==null||y==null) return; if(!st){ cx.moveTo(x,y); st=true; } else cx.lineTo(x,y); any=true; }); if(any) stroke(it.col,it.lw,it.dash); }
    });
    if(D.warn&&D.warn.length){ cx.font='11px system-ui,sans-serif'; cx.textBaseline='top'; cx.textAlign='left'; D.warn.forEach((t,i)=>{ cx.fillStyle='rgba(242,54,69,.95)'; cx.fillText('Time & Price: '+t,8,6+i*14); }); }
    cx.restore(); }; }
}catch(err){ console.error('tool11 [tpz] failed',err); }
