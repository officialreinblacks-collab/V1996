  gapType:'True GAP', gapCol:'#4ec1f7', gapTr:90, gapMax:7, gapCE:true, gapStyle:'Dashed', gapMit:'Engulf', gapExt:true,
  fvgType:'Normal', showImp:false, showInv:false, fvgBull:'#4caf50', fvgBear:'#f23645', impBull:'#4caf50', impBear:'#f23645',

const ivRgba=(hex,tr)=>{ const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); const a=Math.max(0,Math.min(1,1-(+tr||0)/100)); if(!m) return 'rgba(128,128,128,'+a+')'; const n=parseInt(m[1],16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'; };
const ivDash=s=>s==='Dotted'?[1.5,3]:s==='Dashed'?[5,4]:[];

// ---------------------------------------------------------------- engine (closed candles, one pass, nothing repaints)
function ivCompute(c,p){
  const n=c.length, Z=[];
  const G={viBu:[],viBe:[],gpBu:[],gpBe:[],fvBu:[],fvBe:[],ifBu:[],ifBe:[],inBu:[],inBe:[]};

  const viOn=p.viType==='Classic'||p.viType==='Advanced', viAdv=p.viType==='Advanced';
  const trueGap=p.gapType==='True GAP', gapImb=p.gapType==='GAP + Inefficiency';
  const fvNorm=p.fvgType==='Normal', lv=p.fvgType==='Liquidity Void', inv=!!p.showInv;
  const fvgGen=fvNorm||(inv&&!lv), fvgHide=!fvNorm&&!lv&&inv;
  const mk=(k,d,l,top,bot,lab,r,c0,ce,hid)=>({k:k,d:d,l:l,top:Math.max(top,bot),bot:Math.min(top,bot),lab:lab,r:r,c0:c0,ce:!!ce,hid:!!hid,mit:-1,tc:false,dead:false});

  const rm=(g,z)=>{ const i=g.indexOf(z); if(i>=0) g.splice(i,1); z.dead=true; };
  const up=i=>i>=2&&L(i)>H(i-2)&&L(i-1)<=H(i-2)&&H(i-1)>=L(i);
  const dn=i=>i>=2&&H(i)<L(i-2)&&H(i)>=L(i-1)&&H(i-1)>=L(i-2);
  const ifu=t=>t>=2&&H(t)>H(t-2)&&L(t-2)<L(t)&&L(t)<=H(t-2)&&H(t-2)-mx(t-2)>body(t-2)/2&&mn(t)-L(t)>body(t)/2&&L(t)>L(t-1)&&(H(t-2)+mx(t-2))/2<(mn(t)+L(t))/2&&H(t)>H(t-1)&&C(t-1)>O(t-1);
  const ife=t=>t>=2&&L(t)<L(t-2)&&H(t-2)>H(t)&&H(t)>=L(t-2)&&mn(t-2)-L(t-2)>body(t-2)/2&&H(t)-mx(t)>body(t)/2&&H(t)<H(t-1)&&(mn(t-2)+L(t-2))/2>(H(t)+mx(t))/2&&L(t)<L(t-1)&&C(t-1)<O(t-1);

    if(trueGap||gapImb){
      const gp=(d,top,bot)=>add(d>0?G.gpBu:G.gpBe,p.gapMax,mk('gap',d,t-1,top,bot,d>0?'GAP+':'GAP-',t+1,t+1,p.gapCE));

      else if(dn(t)&&!dn(t-1)) add(G.fvBe,p.fvgMax,mk('fvg',-1,t-2,L(t-2),h,'FVG-',t,t,p.fvgCE,false));
    }
    // ---- Implied FVG
    if(p.showImp){
      if(ifu(t)) add(G.ifBu,p.fvgMax,mk('ifvg',1,t-2,(mn(t)+l)/2,(H(t-2)+mx(t-2))/2,'Imp.FVG+',t+1,t+1,false));
      if(ife(t)) add(G.ifBe,p.fvgMax,mk('ifvg',-1,t-2,(mn(t-2)+L(t-2))/2,(mx(t)+h)/2,'Imp.FVG-',t+1,t+1,false));
    }
    // ---------------- extension / mitigation for bar t
    if(p.fvgExt){
      // implied FVG
      [G.ifBu,G.ifBe].forEach(g=>g.forEach(z=>{ if(z.mit>=0||z.dead||t<z.c0) return; let ok;
        if(p.impMit==='Engulf'){ ok=z.d>0?(cc>=z.bot&&o>=z.bot):(cc<=z.top&&o<=z.top); if(ok&&p.hl&&(z.d>0?l<z.top:h>z.bot)) z.tc=true; }
        else ok=z.d>0?l>=z.top:h<=z.bot;
        if(ok) z.r=t+1; else z.mit=t; }));
      // FVG / liquidity void
      [G.fvBu,G.fvBe].forEach(g=>g.slice().forEach(z=>{ if(z.mit>=0||z.dead||t<z.c0) return; const m=p.fvgMit;

        } else {
          if(z.d>0){ if(l>=z.top) z.r=t+1; else if(l<z.top&&l>z.bot){ z.top=l; z.r=t+1; if(p.hl) z.tc=true; } else z.mit=t; }
          else { if(h<=z.bot) z.r=t+1; else if(h>z.bot&&h<z.top){ z.bot=h; z.r=t+1; if(p.hl) z.tc=true; } else z.mit=t; }
        } }));
    }
    // inverse FVG boxes: live while price keeps respecting them, deleted the moment it closes through
    [G.inBu,G.inBe].forEach(g=>g.slice().forEach(z=>{ if(z.dead) return;
      if(z.d>0){ if(cc>=z.bot){ z.r=t+1; z.tc=!!(p.hl&&l<z.top); } else rm(g,z); }
      else { if(cc<=z.top){ z.r=t+1; z.tc=!!(p.hl&&h>z.bot); } else rm(g,z); } }));
    // volume imbalance
    if(p.viExtAll){ [G.viBu,G.viBe].forEach(g=>g.forEach(z=>{ if(!z.dead) z.r=t+1; })); }
    else if(p.viExt){
      [G.viBu,G.viBe].forEach(g=>g.forEach(z=>{ if(z.mit>=0||z.dead||t<z.c0) return; let ok;
        if(p.viMit==='Engulf'){ ok=z.d>0?cc>=z.bot:cc<=z.top; if(ok&&p.hl&&(z.d>0?l<z.top:h>z.bot)) z.tc=true; }
        else ok=z.d>0?l>z.top:h<z.top;
        if(ok) z.r=t+1; else z.mit=t; }));
    }
    // gaps
    if(p.gapExt){
      [G.gpBu,G.gpBe].forEach(g=>g.forEach(z=>{ if(z.mit>=0||z.dead||t<z.c0) return;
        if(p.gapMit==='Engulf'){
          const ok=z.d>0?(cc>=z.bot&&o>=z.bot):(cc<=z.top&&o<=z.top);
          if(ok){ z.r=t+1; if(p.hl&&(z.d>0?l<z.top:h>z.bot)) z.tc=true; } else z.mit=t;
        } else {
          if(z.d>0){ if(l>=z.top) z.r=t+1; else if(l<z.top&&l>z.bot){ z.top=l; z.r=t+1; if(p.hl) z.tc=true; } else z.mit=t; }
          else { if(h<=z.bot) z.r=t+1; else if(h>z.bot&&h<z.top){ z.bot=h; z.r=t+1; if(p.hl) z.tc=true; } else z.mit=t; }
        } }));
    }
  }
  return {Z:Z.filter(z=>!z.dead&&!z.hid), n:n};
}
let ivKey='', ivVal=null;
function ivGet(c,p){
  const n=c.length, k=n+'|'+(n?c[n-1].close+'|'+c[n-1].high+'|'+c[n-1].low+'|'+c[0].open:'')+'|'+JSON.stringify(p);
  if(k!==ivKey){ ivKey=k; try{ ivVal=ivCompute(c,p); }catch(e){ console.error('ivi compute',e); ivVal={Z:[],n:n}; } }

}

{ const _D=draw; draw=function(d,X,Y,W,H){ if(!d||d.type!=='iviview') return _D.apply(this,arguments);
