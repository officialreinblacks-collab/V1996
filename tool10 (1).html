<h1>tool10.html · ICT Imbalances [VHX]</h1>
<p>This file is not a page to open. <b>index.html</b> loads it and runs the tool inside the chart app. Keep <b>tool10.html</b>, <b>index.html</b> and <b>Script2.html</b> in the same folder.</p>
<script type="text/plain" id="mpvT10">
// ===================================================================================================
// MarketPlusView tool code  -  tool10.html  -  loaded by index.html, run INSIDE the app (direct eval in start()).
// [ivi] INDICATOR: ICT - GAPS, Volume & Price Imbalances  (port of the Pine v6 script by Vulnerable_human_x, MPL 2.0)
// Draws: Volume Imbalances (Classic / Advanced), True GAPs or GAP + Inefficiency, FVG (Normal / Liquidity Void),
// Implied FVG and Inverse FVG, each with C.E. line, mitigation (Engulf / Mitigate / Rebalance), box limits,
// highlight when price is inside a box and grey mitigated boxes. Guide: Script2.html#ivi
// ===================================================================================================
try{
const IV_DEF={
  viType:'Classic', viBull:'#00e640', viBear:'#e30000', viTr:90, viMax:8, viMit:'Engulf', viExt:true, viExtAll:false,
  gapType:'True GAP', gapCol:'#4ec1f7', gapTr:90, gapMax:7, gapCE:true, gapStyle:'Dashed', gapMit:'Engulf', gapExt:true,
  fvgType:'Normal', showImp:false, showInv:false, fvgBull:'#4caf50', fvgBear:'#f23645', impBull:'#4caf50', impBear:'#f23645',
  invBull:'#fbc02d', invBear:'#fbc02d', fvgTr:90, invTr:94, fvgMax:15, invMax:4, fvgMit:'Engulf', impMit:'Engulf',
  fvgCE:true, ceStyle:'Dashed', ceTr:50, fvgExt:true,
  bStyle:'Solid', bTr:85, hl:true, hlBg:80, hlBd:67, lbl:true, lblSize:'Tiny', lblCol:'#a1a3ab', hAlign:'Center', vAlign:'Middle',
  mitOn:true, mitCol:'#787b86', mitTr:92, mitLblTr:88
};
const ivRgba=(hex,tr)=>{ const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); const a=Math.max(0,Math.min(1,1-(+tr||0)/100)); if(!m) return 'rgba(128,128,128,'+a+')'; const n=parseInt(m[1],16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'; };
const ivDash=s=>s==='Dotted'?[1.5,3]:s==='Dashed'?[5,4]:[];

// ---------------------------------------------------------------- engine (closed candles, one pass, nothing repaints)
function ivCompute(c,p){
  const n=c.length, Z=[];
  const G={viBu:[],viBe:[],gpBu:[],gpBe:[],fvBu:[],fvBe:[],ifBu:[],ifBe:[],inBu:[],inBe:[]};
  if(n<4) return {Z:Z,n:n};
  const O=i=>c[i].open, H=i=>c[i].high, L=i=>c[i].low, C=i=>c[i].close;
  const mx=i=>Math.max(O(i),C(i)), mn=i=>Math.min(O(i),C(i)), body=i=>Math.abs(C(i)-O(i));
  const viOn=p.viType==='Classic'||p.viType==='Advanced', viAdv=p.viType==='Advanced';
  const trueGap=p.gapType==='True GAP', gapImb=p.gapType==='GAP + Inefficiency';
  const fvNorm=p.fvgType==='Normal', lv=p.fvgType==='Liquidity Void', inv=!!p.showInv;
  const fvgGen=fvNorm||(inv&&!lv), fvgHide=!fvNorm&&!lv&&inv;
  const mk=(k,d,l,top,bot,lab,r,c0,ce,hid)=>({k:k,d:d,l:l,top:Math.max(top,bot),bot:Math.min(top,bot),lab:lab,r:r,c0:c0,ce:!!ce,hid:!!hid,mit:-1,tc:false,dead:false});
  const add=(g,lim,z)=>{ if(g.length>lim){ const o=g.shift(); o.dead=true; } g.push(z); Z.push(z); };
  const rm=(g,z)=>{ const i=g.indexOf(z); if(i>=0) g.splice(i,1); z.dead=true; };
  const up=i=>i>=2&&L(i)>H(i-2)&&L(i-1)<=H(i-2)&&H(i-1)>=L(i);
  const dn=i=>i>=2&&H(i)<L(i-2)&&H(i)>=L(i-1)&&H(i-1)>=L(i-2);
  const ifu=t=>t>=2&&H(t)>H(t-2)&&L(t-2)<L(t)&&L(t)<=H(t-2)&&H(t-2)-mx(t-2)>body(t-2)/2&&mn(t)-L(t)>body(t)/2&&L(t)>L(t-1)&&(H(t-2)+mx(t-2))/2<(mn(t)+L(t))/2&&H(t)>H(t-1)&&C(t-1)>O(t-1);
  const ife=t=>t>=2&&L(t)<L(t-2)&&H(t-2)>H(t)&&H(t)>=L(t-2)&&mn(t-2)-L(t-2)>body(t-2)/2&&H(t)-mx(t)>body(t)/2&&H(t)<H(t-1)&&(mn(t-2)+L(t-2))/2>(H(t)+mx(t))/2&&L(t)<L(t-1)&&C(t-1)<O(t-1);
  for(let t=1;t<n;t++){
    const o=O(t),h=H(t),l=L(t),cc=C(t), o1=O(t-1),c1=C(t-1),h1=H(t-1),l1=L(t-1);
    // ---- Volume Imbalance
    if(viOn){
      const vi=(d,top,bot)=>add(d>0?G.viBu:G.viBe,p.viMax,mk('vi',d,t-1,top,bot,d>0?'VI+':'VI-',t+1,t+1,false));
      if(o>c1&&l<=h1&&cc>o&&c1>o1) vi(1,o,c1);
      if(o<c1&&h>=l1&&cc<o&&c1<o1) vi(-1,c1,o);
      if(viAdv){
        if(o<c1&&cc>o&&c1>o1&&h>=l1) vi(1,c1,o);
        if(o>c1&&cc<o&&c1<o1&&l<=h1) vi(-1,o,c1);
        if(o!==c1&&cc>o&&c1<o1&&h>=l1&&l<=h1) vi(1,Math.max(o,c1),Math.min(o,c1));
        if(o!==c1&&cc<o&&c1>o1&&l<=h1&&h>=l1) vi(-1,Math.min(o,c1),Math.max(o,c1));
      }
    }
    // ---- GAP
    if(trueGap||gapImb){
      const gp=(d,top,bot)=>add(d>0?G.gpBu:G.gpBe,p.gapMax,mk('gap',d,t-1,top,bot,d>0?'GAP+':'GAP-',t+1,t+1,p.gapCE));
      if(h1<l) gp(1,trueGap?l:o,trueGap?h1:c1);
      else if(l1>h) gp(-1,trueGap?l1:c1,trueGap?h:o);
    }
    // ---- FVG
    if(fvgGen){
      if(up(t)) add(G.fvBu,p.fvgMax,mk('fvg',1,t-2,l,H(t-2),'FVG+',t,t,p.fvgCE,fvgHide));
      if(dn(t)) add(G.fvBe,p.fvgMax,mk('fvg',-1,t-2,L(t-2),h,'FVG-',t,t,p.fvgCE,fvgHide));
    }
    if(lv&&t>=3){
      if(up(t)&&up(t-1)&&G.fvBu.length>0){ const old=G.fvBu.pop(); old.dead=true; add(G.fvBu,p.fvgMax,mk('fvg',1,old.l,l,old.bot,'LV+',t,t,p.fvgCE,false)); }
      else if(up(t)&&!up(t-1)) add(G.fvBu,p.fvgMax,mk('fvg',1,t-2,l,H(t-2),'FVG+',t,t,p.fvgCE,false));
      if(dn(t)&&dn(t-1)&&G.fvBe.length>0){ const old=G.fvBe.pop(); old.dead=true; add(G.fvBe,p.fvgMax,mk('fvg',-1,old.l,old.top,h,'LV-',t,t,p.fvgCE,false)); }
      else if(dn(t)&&!dn(t-1)) add(G.fvBe,p.fvgMax,mk('fvg',-1,t-2,L(t-2),h,'FVG-',t,t,p.fvgCE,false));
    }
    // ---- Implied FVG
    if(p.showImp){
      if(ifu(t)) add(G.ifBu,p.fvgMax,mk('ifvg',1,t-2,(mn(t)+l)/2,(H(t-2)+mx(t-2))/2,'Imp.FVG+',t+1,t+1,false));
      if(ife(t)) add(G.ifBe,p.fvgMax,mk('ifvg',-1,t-2,(mn(t-2)+L(t-2))/2,(mx(t)+h)/2,'Imp.FVG-',t+1,t+1,false));
    }
    // ---------------- extension / mitigation for bar t
    if(p.fvgExt){
      // implied FVG
      [G.ifBu,G.ifBe].forEach(g=>g.forEach(z=>{ if(z.mit>=0||z.dead||t<z.c0) return; let ok;
        if(p.impMit==='Engulf'){ ok=z.d>0?(cc>=z.bot&&o>=z.bot):(cc<=z.top&&o<=z.top); if(ok&&p.hl&&(z.d>0?l<z.top:h>z.bot)) z.tc=true; }
        else ok=z.d>0?l>=z.top:h<=z.bot;
        if(ok) z.r=t+1; else z.mit=t; }));
      // FVG / liquidity void
      [G.fvBu,G.fvBe].forEach(g=>g.slice().forEach(z=>{ if(z.mit>=0||z.dead||t<z.c0) return; const m=p.fvgMit;
        if(m==='Engulf'){
          const ok=z.d>0?cc>=z.bot:cc<=z.top;
          if(ok){ z.r=t+1; if(p.hl&&(z.d>0?l<z.top:h>z.bot)) z.tc=true; }
          else if(inv){ rm(g,z); const q=mk('inv',-z.d,z.l,z.top,z.bot,z.d>0?'I.FVG-':'I.FVG+',t,t,z.ce,false); add(q.d>0?G.inBu:G.inBe,p.invMax,q); }
          else z.mit=t;
        } else if(m==='Mitigate'){
          const ok=z.d>0?l>=z.top:h<=z.bot; if(ok) z.r=t+1; else z.mit=t;
        } else {
          if(z.d>0){ if(l>=z.top) z.r=t+1; else if(l<z.top&&l>z.bot){ z.top=l; z.r=t+1; if(p.hl) z.tc=true; } else z.mit=t; }
          else { if(h<=z.bot) z.r=t+1; else if(h>z.bot&&h<z.top){ z.bot=h; z.r=t+1; if(p.hl) z.tc=true; } else z.mit=t; }
        } }));
    }
    // inverse FVG boxes: live while price keeps respecting them, deleted the moment it closes through
    [G.inBu,G.inBe].forEach(g=>g.slice().forEach(z=>{ if(z.dead) return;
      if(z.d>0){ if(cc>=z.bot){ z.r=t+1; z.tc=!!(p.hl&&l<z.top); } else rm(g,z); }
      else { if(cc<=z.top){ z.r=t+1; z.tc=!!(p.hl&&h>z.bot); } else rm(g,z); } }));
    // volume imbalance
    if(p.viExtAll){ [G.viBu,G.viBe].forEach(g=>g.forEach(z=>{ if(!z.dead) z.r=t+1; })); }
    else if(p.viExt){
      [G.viBu,G.viBe].forEach(g=>g.forEach(z=>{ if(z.mit>=0||z.dead||t<z.c0) return; let ok;
        if(p.viMit==='Engulf'){ ok=z.d>0?cc>=z.bot:cc<=z.top; if(ok&&p.hl&&(z.d>0?l<z.top:h>z.bot)) z.tc=true; }
        else ok=z.d>0?l>z.top:h<z.top;
        if(ok) z.r=t+1; else z.mit=t; }));
    }
    // gaps
    if(p.gapExt){
      [G.gpBu,G.gpBe].forEach(g=>g.forEach(z=>{ if(z.mit>=0||z.dead||t<z.c0) return;
        if(p.gapMit==='Engulf'){
          const ok=z.d>0?(cc>=z.bot&&o>=z.bot):(cc<=z.top&&o<=z.top);
          if(ok){ z.r=t+1; if(p.hl&&(z.d>0?l<z.top:h>z.bot)) z.tc=true; } else z.mit=t;
        } else {
          if(z.d>0){ if(l>=z.top) z.r=t+1; else if(l<z.top&&l>z.bot){ z.top=l; z.r=t+1; if(p.hl) z.tc=true; } else z.mit=t; }
          else { if(h<=z.bot) z.r=t+1; else if(h>z.bot&&h<z.top){ z.bot=h; z.r=t+1; if(p.hl) z.tc=true; } else z.mit=t; }
        } }));
    }
  }
  return {Z:Z.filter(z=>!z.dead&&!z.hid), n:n};
}
let ivKey='', ivVal=null;
function ivGet(c,p){
  const n=c.length, k=n+'|'+(n?c[n-1].close+'|'+c[n-1].high+'|'+c[n-1].low+'|'+c[0].open:'')+'|'+JSON.stringify(p);
  if(k!==ivKey){ ivKey=k; try{ ivVal=ivCompute(c,p); }catch(e){ console.error('ivi compute',e); ivVal={Z:[],n:n}; } }
  return ivVal;
}

// ---------------------------------------------------------------- registration
IND.ivi={label:'ICT \u00b7 GAPS, Volume & Price Imbalances [VHX]',cat:'Trend',nm:()=>'ICT Imbalances [VHX]',p:Object.assign({},IV_DEF),cols:['#4ec1f7'],
  fields:[
    ['viType','sel','Volume Imbalance type',{opts:['None','Classic','Advanced']}],['viBull','col','Bullish VI color'],['viBear','col','Bearish VI color'],['viTr','num','VI fill transparency %',{min:0,max:100}],
    ['viMax','num','VI max boxes',{min:1,max:100}],['viMit','sel','VI mitigation',{opts:['Engulf','Mitigate']}],['viExt','chk','Extend unmitigated VI boxes'],['viExtAll','chk','Extend all VI boxes'],
    ['gapType','sel','GAP type',{opts:['None','True GAP','GAP + Inefficiency']}],['gapCol','col','GAP color'],['gapTr','num','GAP fill transparency %',{min:0,max:100}],['gapMax','num','GAP max boxes',{min:1,max:100}],
    ['gapCE','chk','GAP Consequent Encroachment (C.E.)'],['gapStyle','sel','GAP C.E. line style',{opts:['Dashed','Dotted','Solid']}],['gapMit','sel','GAP mitigation',{opts:['Engulf','Rebalance']}],['gapExt','chk','Extend unmitigated GAP boxes'],
    ['fvgType','sel','FVG type',{opts:['None','Normal','Liquidity Void']}],['showImp','chk','Implied FVG'],['showInv','chk','Inverse FVG (needs FVG mitigation = Engulf)'],
    ['fvgBull','col','Bullish FVG'],['fvgBear','col','Bearish FVG'],['impBull','col','Bullish implied FVG'],['impBear','col','Bearish implied FVG'],['invBull','col','Bullish inverse FVG'],['invBear','col','Bearish inverse FVG'],
    ['fvgTr','num','FVG fill transparency %',{min:0,max:100}],['invTr','num','Inverse FVG fill transparency %',{min:0,max:100}],['fvgMax','num','FVG / implied FVG max boxes',{min:1,max:100}],['invMax','num','Inverse FVG max boxes',{min:1,max:100}],
    ['fvgMit','sel','FVG / LV mitigation',{opts:['Engulf','Mitigate','Rebalance']}],['impMit','sel','Implied FVG mitigation',{opts:['Engulf','Mitigate']}],
    ['fvgCE','chk','FVG Consequent Encroachment (C.E.)'],['ceStyle','sel','FVG C.E. line style',{opts:['Dashed','Dotted','Solid']}],['ceTr','num','C.E. transparency %',{min:0,max:100}],['fvgExt','chk','Extend all unmitigated FVG boxes'],
    ['bStyle','sel','Box border style',{opts:['Solid','Dashed','Dotted']}],['bTr','num','Border transparency %',{min:0,max:100}],
    ['hl','chk','Highlight box when price is inside it'],['hlBg','num','Highlight fill transparency %',{min:0,max:100}],['hlBd','num','Highlight border transparency %',{min:0,max:100}],
    ['lbl','chk','Show labels'],['lblSize','sel','Label size',{opts:['Tiny','Small','Normal','Large','Huge']}],['lblCol','col','Label color'],
    ['hAlign','sel','Label horizontal align',{opts:['Center','Left','Right']}],['vAlign','sel','Label vertical align',{opts:['Middle','Top','Bottom']}],
    ['mitOn','chk','Grey out mitigated boxes'],['mitCol','col','Mitigated box color'],['mitTr','num','Mitigated transparency %',{min:0,max:100}],['mitLblTr','num','Mitigated label transparency %',{min:0,max:100}]],
  calc:(c,p)=>[[]],
  extras:(c,p)=>{ const q=Object.assign({},IV_DEF,p); const cl=c.length>4?c.slice(0,-1):c; /* closed candles only: the forming candle is left out so boxes never flicker mid-bar */ return {mk:[],boxes:[{type:'iviview',pts:[],o:q,D:ivGet(cl,q)}],labels:[]}; }};

{ const _D=draw; draw=function(d,X,Y,W,H){ if(!d||d.type!=='iviview') return _D.apply(this,arguments);
    const p=d.o, D=d.D, n0=candles.length; if(!D||!D.Z||!D.Z.length||n0<4) return;
    cx.save(); cx.beginPath(); cx.rect(0,0,W,H); cx.clip(); cx.textBaseline='middle'; cx.lineWidth=1;
    const fs={Tiny:9,Small:10,Normal:12,Large:14,Huge:18}[p.lblSize]||9;
    const bdash=ivDash(p.bStyle);
    D.Z.forEach(z=>{
      const x0=X(z.l), x1=X(z.r), y0=Y(z.top), y1=Y(z.bot); if(x0==null||x1==null||y0==null||y1==null) return;
      if(x1<-5||x0>W+5) return;
      const bx=Math.min(x0,x1), bw=Math.max(2,Math.abs(x1-x0)), by=Math.min(y0,y1), bh=Math.max(1,Math.abs(y1-y0));
      const mit=z.mit>=0&&p.mitOn;
      const base=z.k==='vi'?(z.d>0?p.viBull:p.viBear):z.k==='gap'?p.gapCol:z.k==='fvg'?(z.d>0?p.fvgBull:p.fvgBear):z.k==='ifvg'?(z.d>0?p.impBull:p.impBear):(z.d>0?p.invBull:p.invBear);
      const ftr=z.k==='vi'?p.viTr:z.k==='gap'?p.gapTr:z.k==='inv'?p.invTr:p.fvgTr;
      let fill,bord,txt,ceC;
      if(mit){ fill=ivRgba(p.mitCol,p.mitTr); bord=fill; txt=ivRgba(p.lblCol,p.mitLblTr); ceC=fill; }
      else if(z.tc){ fill=ivRgba(base,p.hlBg); bord=ivRgba(base,p.hlBd); txt=ivRgba(p.lblCol,0); ceC=ivRgba(base,p.ceTr); }
      else { fill=ivRgba(base,ftr); bord=ivRgba(base,p.bTr); txt=ivRgba(p.lblCol,0); ceC=ivRgba(base,p.ceTr); }
      cx.fillStyle=fill; cx.fillRect(bx,by,bw,bh);
      cx.strokeStyle=bord; cx.setLineDash(bdash); cx.strokeRect(bx+.5,by+.5,Math.max(1,bw-1),Math.max(0,bh-1)); cx.setLineDash([]);
      if(z.ce){ const ym=(y0+y1)/2; cx.strokeStyle=ceC; cx.setLineDash(ivDash(z.k==='gap'?p.gapStyle:p.ceStyle)); cx.beginPath(); cx.moveTo(bx,ym); cx.lineTo(bx+bw,ym); cx.stroke(); cx.setLineDash([]); }
      if(p.lbl&&z.lab&&bw>18&&bh>=fs-1){
        cx.save(); cx.beginPath(); cx.rect(bx,by,bw,bh); cx.clip();
        cx.font=fs+'px system-ui,sans-serif'; cx.fillStyle=txt;
        const al=p.hAlign==='Left'?'left':p.hAlign==='Right'?'right':'center';
        const tx=al==='left'?bx+3:al==='right'?bx+bw-3:bx+bw/2;
        const ty=p.vAlign==='Top'?by+fs/2+2:p.vAlign==='Bottom'?by+bh-fs/2-2:by+bh/2;
        cx.textAlign=al; cx.fillText(z.lab,tx,ty); cx.restore(); }
    });
    cx.restore(); }; }
}catch(err){ console.error('tool10 [ivi] failed',err); }
</script>
