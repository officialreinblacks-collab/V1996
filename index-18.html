</style>

<script>
(function(){
  var sp=document.getElementById('splash'),img=document.getElementById('spImg'),t0=Date.now(),done=false;
  function hide(){ if(done) return; done=true; sp.classList.add('out'); setTimeout(function(){ sp.remove(); },1000); }
  // show for ~3.5s total (counted from when the image is ready), then fade out
  function arm(){ setTimeout(hide,Math.max(0,3500-(Date.now()-t0))); }
  if(img.complete&&img.naturalWidth) arm(); else { img.addEventListener('load',function(){ t0=Date.now(); arm(); }); img.addEventListener('error',hide); }
  setTimeout(hide,8000); // safety net
})();
</script>
<script>

const GROUPS={

];
const BASE_SEC={'1s':1,'1m':60,'3m':180,'5m':300,'15m':900,'30m':1800,'1h':3600,'2h':7200,'4h':14400,'6h':21600,'12h':43200,'1d':86400,'1w':604800};
const COLORS=['#2962ff','#4dabf7','#f5b942','#fbc02d','#ffeb3b','#ff9800','#ff5d7a','#e53935','#b18cff','#9c27b0','#90ee90','#2dd4a7','#009688','#ffffff'];
let sym=SYMS[0], tf=GROUPS.Days[0], base=[], candles=[], ws=null, token=0;
let lineMode=false, statusText='connecting…', inds=[], uid=0, colOpen=true, statHtml='', storeOk=true, indMk=[], stratMk=[], scriptBoxes=[], scriptZones=[], alerts=[], aid=0, ctype=0, moreOld=true, loadingOld=false, quietNext=false, lastBuyT=0, lastBuyMap={}, drawings=[], pending=null, dtab='Tools';
const $=id=>document.getElementById(id);

const isNative=t=>t[3]?t[3]===1:t[2]===BASE_SEC[t[1]];
const key=(t,d)=>{ if(d[3]){const x=new Date(t*1000);return Math.floor((x.getUTCFullYear()*12+x.getUTCMonth())/d[3]);} return Math.floor(t/d[2]); };
const keyTime=(k,d)=>d[3]?Date.UTC(Math.floor(k*d[3]/12),(k*d[3])%12,1)/1000:k*d[2];
function aggregate(data,d){
  if(isNative(d)) return data;
  const out=[];
  for(const c of data){
    const time=keyTime(key(c.time,d),d), l=out[out.length-1];
    if(l&&l.time===time){ l.high=Math.max(l.high,c.high); l.low=Math.min(l.low,c.low); l.close=c.close; l.volume+=c.volume; }
    else out.push({time,open:c.open,high:c.high,low:c.low,close:c.close,volume:c.volume});
  }
  return out;
}

const opts=()=>({autoSize:true,layout:{background:{type:'solid',color:'#0b0e14'},textColor:'#7f8aa3',fontFamily:'Inter,system-ui,sans-serif',fontSize:11},
  grid:{vertLines:{color:'rgba(255,255,255,.025)'},horzLines:{color:'rgba(255,255,255,.035)'}},
  crosshair:{mode:0,vertLine:{color:'rgba(124,140,255,.55)',width:1,style:3,labelBackgroundColor:'#7c8cff'},horzLine:{color:'rgba(124,140,255,.55)',width:1,style:3,labelBackgroundColor:'#7c8cff'}},
  timeScale:{timeVisible:true,secondsVisible:true,rightOffset:6,borderVisible:false},rightPriceScale:{borderVisible:false,scaleMargins:{top:.12,bottom:.1}}});
const chart=LightweightCharts.createChart($('main'),opts());
const rsiChart=LightweightCharts.createChart($('rsi'),opts());
const osc2Chart=LightweightCharts.createChart($('osc2'),opts());
const candle=chart.addCandlestickSeries({upColor:'#2dd4a7',downColor:'#ff5d7a',borderVisible:false,wickUpColor:'#2dd4a7',wickDownColor:'#ff5d7a',lastValueVisible:false,priceLineStyle:1,priceLineWidth:1});
const lineS=chart.addLineSeries({color:'#4dabf7',lineWidth:2,visible:false,lastValueVisible:false});
const S=()=>lineMode?lineS:candle;
let syncing=false;
const link=(a,b)=>a.timeScale().subscribeVisibleLogicalRangeChange(r=>{ if(syncing||!r)return; syncing=true; b.timeScale().setVisibleLogicalRange(r); syncing=false; updateTag(); render(); });
const allCharts=[chart,rsiChart,osc2Chart];
allCharts.forEach(c=>c.timeScale().subscribeVisibleLogicalRangeChange(r=>{ if(syncing||!r) return; syncing=true; allCharts.forEach(o=>{ if(o!==c) o.timeScale().setVisibleLogicalRange(r); }); syncing=false; updateTag(); render(); }));

// ---------- indicators ----------
const val=(c,s)=>s==='hl2'?(c.high+c.low)/2:c[s];
function emaS(d,n,s){ const k=2/(n+1),o=[]; let p; d.forEach((c,i)=>{ const v=val(c,s); p=i===0?v:v*k+p*(1-k); if(i>=n-1) o.push({time:c.time,value:p}); }); return o; }
function smaS(d,n,s){ const o=[]; let a=0; d.forEach((c,i)=>{ a+=val(c,s); if(i>=n) a-=val(d[i-n],s); if(i>=n-1) o.push({time:c.time,value:a/n}); }); return o; }
function rsiS(d,n,s){ const o=[]; let g=0,l=0;
  for(let i=1;i<d.length;i++){ const x=val(d[i],s)-val(d[i-1],s), gg=Math.max(x,0), ll=Math.max(-x,0);
    if(i<=n){ g+=gg; l+=ll; if(i===n){g/=n;l/=n;} } else { g=(g*(n-1)+gg)/n; l=(l*(n-1)+ll)/n; }
    if(i>=n) o.push({time:d[i].time,value:l===0?100:100-100/(1+g/l)}); } return o; }
// Reinblacks RSI Bullish Divergence Retest (ported from Pine v6)
function rsiArr(c,n){ const r=new Array(c.length).fill(NaN); let g=0,l=0;
  for(let i=1;i<c.length;i++){ const x=c[i].close-c[i-1].close, gg=Math.max(x,0), ll=Math.max(-x,0);
    if(i<=n){ g+=gg; l+=ll; if(i===n){ g/=n; l/=n; r[i]=l===0?100:100-100/(1+g/l); } }
    else { g=(g*(n-1)+gg)/n; l=(l*(n-1)+ll)/n; r[i]=l===0?100:100-100/(1+g/l); } }
  return r; }
function rdrCalc(c,p){
  const n=c.length, rsi=rsiArr(c,p.rsi), L=p.left, R=p.right, tol=p.tol/100, line=[], mk=[], zones=[];
  const later=p.later!==false, one=p.oneBuy!==false;
  let p1P=NaN,p1R=NaN,p2P=NaN,p2R=NaN,p2Bar=NaN,peak=NaN,cand=NaN,level=NaN,prevLevel=NaN,armed=false,done=false,brk=NaN,box=null,bought=false;
  for(let i=0;i<n;i++){
    const j=i-R; let newP=false, pl=NaN;
    if(j-L>=0){ let ok=true;
      for(let k=j-L;k<=j+R;k++){ if(k===j) continue; if(k<j?c[k].low<c[j].low:c[k].low<=c[j].low){ ok=false; break; } }

function tpoBuild(per,sessS,step,va){

    const key=Math.floor(c.time/sessS);

    cur.i1=i; const pi=Math.floor((c.time-cur.start)/per), lo=Math.floor(c.low/step+1e-9), hi=Math.floor(c.high/step+1e-9);

    const mid=(S_.lo+S_.hi)/2; let poc=S_.lo,mx=0,tot=0;

let strat=null, lastSig=0, stCount=0;
const STRATS={
  brk:{label:'Breakout – close beyond the last N bars',short:'Breakout',param:'Lookback bars',n0:10,sig:(c,i,n)=>{ if(i<n) return 0; let hi=-Infinity,lo=Infinity;
    for(let k=i-n;k<i;k++){ hi=Math.max(hi,c[k].high); lo=Math.min(lo,c[k].low); } return c[i].close>hi?1:c[i].close<lo?-1:0; }},
  eng:{label:'Engulfing candle',short:'Engulfing',n0:0,sig:(c,i)=>{ if(i<1) return 0; const a=c[i-1], b=c[i];
    if(a.close<a.open&&b.close>b.open&&b.close>=a.open&&b.open<=a.close) return 1;
    if(a.close>a.open&&b.close<b.open&&b.close<=a.open&&b.open>=a.close) return -1; return 0; }},
  mom:{label:'N candles in a row (same colour)',short:'Candles in a row',param:'Candles in a row',n0:3,sig:(c,i,n)=>{ if(i<n) return 0;
    const r=[]; for(let k=0;k<n;k++) r.push(c[i-k].close>c[i-k].open); return r.every(x=>x)?1:r.every(x=>!x)?-1:0; }}
};
const SDEF=k=>({long:true,short:true,limit:true,tp:2,useSl:true,sl:1,atr:false,atrLen:14,atrMul:2,n:STRATS[k].n0,comm:0,size:100,buyCol:'#2dd4a7',sellCol:'#ff5d7a',labels:true,vis:VIS0()});
const stVis=()=>strat&&strat.on&&strat.vis[tfGroup()];
function atrS(c,n){ const tr=c.map((x,i)=>i?Math.max(x.high-x.low,Math.abs(x.high-c[i-1].close),Math.abs(x.low-c[i-1].close)):x.high-x.low);
  const a=[]; let s=0; tr.forEach((v,i)=>{ s+=v; if(i>=n) s-=tr[i-n]; a.push(i>=n-1?s/n:0); }); return a; }
function toast(msg,col){ const t=$('toast'); t.textContent=msg; t.style.background=col; t.style.display='block';
  if(navigator.vibrate) navigator.vibrate(200); clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',6000); }
function runStrategy(quiet){
  if(!stVis()){ stratMk=[]; applyMarkers(); statHtml=''; drawInds(); return; }
  const Z=strat, c=candles.slice(0,-1), sg=STRATS[Z.k].sig, m=[], tr=[], atr=Z.atr?atrS(c,Z.atrLen):null; let pos=null;   // closed candles only
  const done=x=>{ tr.push((pos.side*(x/pos.e-1)-2*Z.comm/100)*Z.size/100); pos=null; };
  for(let i=0;i<c.length;i++){
    const b=c[i];
    if(pos){
      const sd=pos.side; let x=null, tag='';
      if(Z.useSl){ const q=pos.e*(1-sd*Z.sl/100); if(sd>0?b.low<=q:b.high>=q){ x=q; tag='SL'; } }
      if(x==null&&atr&&atr[i-1]){ const q=pos.ext-sd*Z.atrMul*atr[i-1]; if(sd>0?b.low<=q:b.high>=q){ x=q; tag='TS'; } }
      if(x==null&&Z.limit){ const q=pos.e*(1+sd*Z.tp/100); if(sd>0?b.high>=q:b.low<=q){ x=q; tag='TP'; } }
      if(x!=null){ done(x); m.push({time:b.time,position:sd>0?'aboveBar':'belowBar',color:tag==='TP'?'#2dd4a7':'#ff5d7a',shape:'circle',text:tag}); continue; }
      pos.ext=sd>0?Math.max(pos.ext,b.close):Math.min(pos.ext,b.close);
    }
    const v=sg(c,i,Z.n); if(!v) continue;
    let mk=false;
    if(pos&&pos.side===-v){ done(b.close); mk=true; }
    if(!pos&&(v>0?Z.long:Z.short)){ pos={side:v,e:b.close,ext:b.close}; mk=true; }
    if(mk) m.push(v>0?{time:b.time,position:'belowBar',color:Z.buyCol,shape:'arrowUp',text:Z.labels?'BUY':''}:{time:b.time,position:'aboveBar',color:Z.sellCol,shape:'arrowDown',text:Z.labels?'SELL':''});
  }
  stratMk=m; applyMarkers();
  const w=tr.filter(x=>x>0).length, tot=tr.reduce((a,x)=>a*(1+x),1)-1;
  statHtml=`${tr.length} trades · win ${tr.length?Math.round(w/tr.length*100):0}% · <span class="${tot>=0?'up':'down'}">${tot>=0?'+':''}${(tot*100).toFixed(1)}%</span>${pos?' · '+(pos.side>0?'long':'short')+' open':''}`;
  drawInds();
  const lm=m[m.length-1];
  if(lm){ if(!quiet&&c.length&&lm.time===c[c.length-1].time&&lm.time>lastSig) toast(`${lm.shape==='arrowUp'?'BUY':lm.shape==='arrowDown'?'SELL':lm.text} signal · ${sym[0]} ${tf[0]}`,lm.color); lastSig=Math.max(lastSig,lm.time); }
}

function condVal(c){
  const last=candles[candles.length-1]; if(!last) return null;
  if(c.k==='px') return {l:last.close,r:c.v};
  if(c.k==='rsi'){ const a=rsiS(candles,c.n,'close'); return a.length?{l:a[a.length-1].value,r:c.v}:null; }
  if(c.k==='ema'){ const a=emaS(candles,c.n,'close'); return a.length?{l:last.close,r:a[a.length-1].value}:null; }
  const w=candles.slice(-21,-1); if(w.length<5) return null;
  return {l:last.volume||0,r:w.reduce((t,x)=>t+(x.volume||0),0)/w.length*c.v};

  const fx='https://fapi.binance.com';
  let id=CGID[baseA];
  if(!id){ const q=await j('https://api.coingecko.com/api/v3/search?query='+baseA); const m=q&&q.coins&&(q.coins.find(c=>c.symbol.toUpperCase()===baseA)||q.coins[0]); id=m&&m.id; }
  const [cg,pi,oi,ls,tk]=await Promise.all([
    id?j('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids='+id):null,
    j(fx+'/fapi/v1/premiumIndex?symbol='+name), j(fx+'/fapi/v1/openInterest?symbol='+name),
    j(fx+'/futures/data/globalLongShortAccountRatio?symbol='+name+'&period=1h&limit=1'), j(fx+'/futures/data/takerlongshortRatio?symbol='+name+'&period=1h&limit=1')]);
  const row=(a,b)=>`<div class="frow"><span>${a}</span><b>${b}</b></div>`, m=cg&&cg[0], h=(t,rows)=>`<h4>${t}</h4>${rows.join('')}`;
  let html='';
  html+=h('MARKET (CoinGecko)',m?[row('Market cap','$'+bigN(m.market_cap)),row('Rank','#'+m.market_cap_rank),row('24h volume','$'+bigN(m.total_volume)),
    row('Circulating supply',bigN(m.circulating_supply)),row('Max supply',m.max_supply?bigN(m.max_supply):'No cap / n.a.'),row('24h change',(m.price_change_percentage_24h||0).toFixed(2)+'%'),
    row('All-time high','$'+bigN(m.ath)+' ('+(m.ath_change_percentage||0).toFixed(1)+'% from it)')]:[row('Data','not available for '+baseA)]);
  const fr=pi&&pi.lastFundingRate!=null?+pi.lastFundingRate*100:null, oiC=oi&&oi.openInterest!=null?+oi.openInterest:null, mp=pi&&pi.markPrice?+pi.markPrice:null;
  html+=h('DERIVATIVES (Binance futures)',pi||oi?[row('Funding rate',fr==null?'–':fr.toFixed(4)+'% per 8h'),
    row('Next funding',pi&&pi.nextFundingTime?new Date(pi.nextFundingTime).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'–'),
    row('Open interest',oiC==null?'–':bigN(oiC)+' '+baseA+(mp?' (~$'+bigN(oiC*mp)+')':'')),
    row('Long / short accounts (1h)',ls&&ls[0]?(+ls[0].longShortRatio).toFixed(2)+'  ('+(+ls[0].longAccount*100).toFixed(0)+'% long)':'–'),
    row('Taker buy / sell volume (1h)',tk&&tk[0]?(+tk[0].buySellRatio).toFixed(2):'–')]:[row('Data','no futures market for '+name+', or blocked by your network')]);
  html+='<div style="color:#9a9a9a;font-size:13px;margin-top:12px">Snapshot taken now. Funding above 0 means longs pay shorts; a very high rate often signals a crowded long trade.</div>';
  if(box.isConnected) box.innerHTML=html;
}

// ---------- save / restore ----------
const KEY='rc_chart_v1';
const getState=()=>({sym:sym[0],tf:tf[0],lineMode,ctype,colOpen,strat,
  alerts:alerts.map(({id,name,sym,tf,conds,mode,trig,on,sound,vib,fired})=>({id,name,sym,tf,mode,trig,on,sound,vib,fired,conds:conds.map(({k,op,v,n})=>({k,op,v,n}))})),
  inds:inds.map(({t,p,cols,on,w,lbl,vis})=>({t,p,cols,on,w,lbl,vis}))});
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(getState())); if(!storeOk){ storeOk=true; } }catch(e){ storeOk=false; } }
function applyState(s){
  inds.forEach(i=>{ const ch=chOf(i); i.ser.forEach(x=>ch.removeSeries(x)); }); inds=[];
  const sy=SYMS.find(x=>x[0]===s.sym); if(sy) sym=sy;
  const t=Object.values(GROUPS).flat().find(x=>x[0]===s.tf); if(t) tf=t;
  colOpen=s.colOpen!==false; setCType(s.ctype!=null?s.ctype:(s.lineMode?1:0),true);
  (s.inds||[]).forEach(o=>{ if(!IND[o.t]) return;
    const i={id:++uid,t:o.t,p:{...clone(IND[o.t].p),...(o.p||{})},cols:o.cols,on:o.on!==false,w:o.w||2,lbl:o.lbl!==false,vis:o.vis||VIS0(),ser:[]}; makeSeries(i); inds.push(i); });
  strat=(s.strat&&STRATS[s.strat.k])?s.strat:null; lastSig=0;
  alerts=(s.alerts||[]).map(a=>({...a,_was:null})); aid=alerts.reduce((m,a)=>Math.max(m,a.id||0),0); updateAlertBtn();
}
function restore(){ try{ localStorage.setItem('rc_t','1'); localStorage.removeItem('rc_t'); const raw=localStorage.getItem(KEY); if(raw) applyState(JSON.parse(raw)); }catch(e){ storeOk=false; } }

// ---------- data ----------
const toCandle=k=>({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]});
async function fetchBase(pages){
  let end=null, all=[], full=false;
  for(let p=0;p<pages;p++){
    const res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym[0]}&interval=${tf[1]}&limit=1000${end?'&endTime='+end:''}`);
    if(!res.ok) throw new Error(res.status);
    const rows=await res.json(); full=rows.length>=1000; if(!rows.length) break;
    all=rows.map(toCandle).concat(all);
    end=rows[0][0]-1; if(!full) break;
  } moreOld=full; return all;
}
async function load(){
  const my=++token;
  if(ws){ ws.onclose=null; ws.close(); }
  drawings=[]; pending=null; disarm(); sel=null; dbarUpdate();
  alerts.forEach(a=>{ a._was=null; a.conds.forEach(c=>{ c._p=null; }); });
  $('bSym').textContent=sym[0]; $('bTf').textContent=tf[0]; save();
  setStatus('loading…');
  for(let tries=1;;tries++){
    try{ base=await fetchBase(4); break; }
    catch(e){ if(my!==token) return; if(tries>=3){ setStatus('could not load data – tap the interval to retry'); return; } setStatus('retrying…'); await new Promise(r=>setTimeout(r,1200)); }
  }
  if(my!==token) return;
  const safe=f=>{ try{ f(); }catch(e){} };
  candles=aggregate(base,tf);
  { const lc=candles.length?candles[candles.length-1].close:1, pd=lc>=1?2:Math.min(10,Math.max(2,Math.ceil(-Math.log10(lc||1))+3));
    candle.applyOptions({priceFormat:{type:'price',precision:pd,minMove:Math.pow(10,-pd)}}); }
  candle.setData(candles);
  // always reset the view so the new market / interval is visible (price scale auto + last bars on screen)
  chart.priceScale('right').applyOptions({autoScale:true}); rsiChart.priceScale('right').applyOptions({autoScale:true}); osc2Chart.priceScale('right').applyOptions({autoScale:true});
  const n=candles.length; chart.timeScale().setVisibleLogicalRange({from:Math.max(0,n-200),to:n+6});
  stCount=n; lastSig=0; quietNext=true; lastBuyT=0; lastBuyMap={};
  safe(()=>drawIndicators(true)); safe(applyVis); safe(()=>runStrategy(true)); safe(()=>{ if(ctype===3) fpEnsure(); });
  setStatus('live'); safe(refresh); connect(my);
}
// scrolling to the left edge loads older candles (up to 30,000)
async function loadOlder(){
  if(loadingOld||!moreOld||!base.length||base.length>=30000) return; loadingOld=true; const my=token;
  try{
    const res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym[0]}&interval=${tf[1]}&limit=1000&endTime=${base[0].time*1000-1}`);
    const rows=await res.json(); if(my!==token||!Array.isArray(rows)) return;
    if(!rows.length){ moreOld=false; return; } moreOld=rows.length>=1000;
    const oldFirst=candles[0].time, r=chart.timeScale().getVisibleLogicalRange();
    base=rows.map(toCandle).concat(base); candles=aggregate(base,tf);
    const shift=Math.max(0,candles.findIndex(c=>c.time===oldFirst));
    candle.setData(candles);
    drawings.forEach(d=>d.pts.forEach(q=>{ q.i+=shift; })); if(pending) pending.pts.forEach(q=>{ q.i+=shift; });
    if(r) chart.timeScale().setVisibleLogicalRange({from:r.from+shift,to:r.to+shift});
    stCount=candles.length; try{ drawIndicators(true); runStrategy(true); if(ctype===3) fpEnsure(); }catch(e){} refresh();
  }catch(e){} finally{ loadingOld=false; }
}
chart.timeScale().subscribeVisibleLogicalRangeChange(r=>{ if(r&&r.from<40) loadOlder(); });
function connect(my){
  ws=new WebSocket(`wss://stream.binance.com:9443/ws/${sym[0].toLowerCase()}@kline_${tf[1]}`);
  ws.onopen=()=>{ if(!pending) setStatus('live'); };
  ws.onmessage=e=>{
    const k=JSON.parse(e.data).k, bc={time:k.t/1000,open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v};
    const lb=base[base.length-1];
    if(lb&&lb.time===bc.time) base[base.length-1]=bc; else base.push(bc);
    let c=bc;
    if(!isNative(tf)){ const kk=key(bc.time,tf); let i=base.length-1;
      while(i>0&&key(base[i-1].time,tf)===kk) i--;
      c=aggregate(base.slice(i),tf)[0]; }
    const l=candles[candles.length-1];
    if(l&&l.time===c.time) candles[candles.length-1]=c; else candles.push(c);
    candle.update(c); drawIndicators(false); refresh(); evalAlerts();
    if(inds.some(i=>IND[i.t].live&&show(i))) recomputeExtras();
    if(candles.length!==stCount){ stCount=candles.length; runStrategy(); }
  };
  ws.onclose=()=>{ if(my!==token) return; setStatus('reconnecting…'); setTimeout(()=>{ if(my===token) connect(my); },2000); };
}
setInterval(()=>{ updateTag(); render(); },300);

// ---------- sheets & toolbar ----------
const sheet=$('sheet'), groups=$('groups');
function openSheet(title,build){ $('pt').textContent=title; groups.innerHTML=''; build(); sheet.classList.add('open'); }
function chips(name){ if(name){ const h=document.createElement('h4'); h.textContent=name; groups.appendChild(h); }
  const box=document.createElement('div'); box.className='chips'; groups.appendChild(box); return box; }
function chip(box,label,on,fn,wide,col){ const b=document.createElement('button'); b.textContent=label;
  b.className=(on?'on ':'')+(wide?'wide':''); if(col) b.style.color=col; b.onclick=fn; box.appendChild(b); }
const close=()=>sheet.classList.remove('open');
sheet.onclick=e=>{ if(e.target===sheet) close(); };
$('bTf').onclick=()=>openSheet('Interval',()=>{
  for(const [name,list] of Object.entries(GROUPS)){ const box=chips(name.toUpperCase());
    list.forEach(t=>chip(box,t[0],t===tf,()=>{ tf=t; close(); load(); })); } });
$('bSym').onclick=()=>openSheet('Markets',()=>{
  const q=document.createElement('input'); q.id='msearch'; q.type='search'; q.placeholder='Search markets…'; q.autocomplete='off'; groups.appendChild(q);
  const list=document.createElement('div'); groups.appendChild(list);
  const draw=()=>{ list.innerHTML=''; const f=q.value.trim().toLowerCase(); let last='', box=null, n=0;
    SYMS.forEach(s=>{ if(f&&!(s[0].toLowerCase().includes(f)||s[1].toLowerCase().includes(f))) return;
      if(s[2]!==last){ last=s[2]; const h=document.createElement('h4'); h.textContent=last.toUpperCase(); list.appendChild(h);
        box=document.createElement('div'); box.className='chips'; list.appendChild(box); }
      n++; chip(box,s[1],s===sym,()=>{ sym=s; close(); load(); },true); });
    if(!n){ const e=document.createElement('div'); e.style.cssText='color:#7f8aa3;padding:16px 2px'; e.textContent='No markets match.'; list.appendChild(e); } };
  q.oninput=draw; draw(); });
$('bInd').onclick=()=>openSheet('Indicators',()=>{
  ['Premium Paid Tool','Trend','Momentum','Volatility','Volume','Scripts'].forEach(cat=>{ const ks=Object.keys(IND).filter(k=>(IND[k].cat||'Scripts')===cat); if(!ks.length) return;
    const box=chips(cat.toUpperCase()); ks.forEach(k=>chip(box,IND[k].label,false,()=>{ addInd(k); close(); },true)); });
  const fb=chips('FUNDAMENTAL'); chip(fb,'Fundamentals – market cap, supply, funding, open interest',false,()=>{ close(); fundSheet(); },true);
  const b2=chips('BACKUP');
  chip(b2,'Copy my settings',false,()=>{ const j=JSON.stringify(getState()); close();
    (navigator.clipboard?navigator.clipboard.writeText(j).then(()=>toast('Settings copied','#2a6df4')):Promise.reject()).catch(()=>prompt('Copy your settings:',j)); },true);
  chip(b2,'Paste settings',false,()=>{ close(); const j=prompt('Paste your settings here:'); if(!j) return;
    try{ applyState(JSON.parse(j)); load(); }catch(e){ toast('Those settings could not be read','#ff5d7a'); } },true); });
$('bDraw').onclick=drawingsSheet;
$('bStrat').onclick=stratSheet;
$('bAlert').onclick=alertsSheet;
$('bType').onclick=()=>openSheet('Chart type',()=>{
  const box=chips(''); [['Candles',0],['Line',1],['Volume candles',2],['Volume footprint',3]].forEach(([l,t])=>chip(box,l,ctype===t,()=>{ setCType(t); close(); },true));
  const n=document.createElement('div'); n.style.cssText='color:#bbb;font-size:13px;margin-top:10px'; n.textContent='Volume candles: wider body = more volume. Footprint: buy/sell volume at each price inside recent candles (zoom in; works best on 1m–5m).'; groups.appendChild(n); });
$('bClear').onclick=()=>{ if(pending){ pending=null; disarm(); setStatus('live'); } else drawings.pop(); sel=null; dbarUpdate(); recomputeExtras(); render(); };
$('bFull').onclick=()=>{ const d=document.documentElement; (document.fullscreenElement?document.exitFullscreen():d.requestFullscreen()).catch(()=>{}); };
new ResizeObserver(render).observe($('main'));
restore();
load();
}
