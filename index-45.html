// ================= Buy zones (support / resistance clusters, flips, retest buys) =================
function zonesCalc(c0,p){
  const c=c0.slice(0,-1), n=c.length, atr=atrW(c,p.atrLen), hk=htfOkArr(c,p), mk=[], all=[];
  let S=[null,null,null], R=[null,null,null], F=null, PL=[], PH=[], lastBuy=NaN;
  const mkZ=(kind,top,bot,left,i)=>{ const z={kind,top,bot,left,act:true,used:false,cBar:i,rBar:i,dropped:false}; all.push(z); return z; };
  for(let i=0;i<n;i++){
    const b=c[i], a=atr[i], j=i-p.pivotRight;
    const bullOk=!p.reqBull||b.close>b.open, coolOk=isNaN(lastBuy)||(i-lastBuy)>p.cooldown, hOk=!p.htfOn||(hk&&hk!=='wait'&&hk[i]);
    let newPL=false,newPH=false,lowNew=0,highNew=0;
    if(j-p.pivotLeft>=0){ if(pivAt(c,j,p.pivotLeft,p.pivotRight,'l')){ newPL=true; lowNew=c[j].low; } if(pivAt(c,j,p.pivotLeft,p.pivotRight,'h')){ newPH=true; highNew=c[j].high; } }
    const retest=z=>!!z&&z.act&&!z.used&&b.low<=z.top&&b.close>z.top&&b.low>=z.bot-p.penAtr*a&&bullOk&&hOk&&coolOk;
    const bS=S.map(retest), bF=p.useFlip&&retest(F), buy=bS.some(Boolean)||bF;
    if(buy){ lastBuy=i; mk.push({time:b.time,position:'belowBar',color:'#90ee90',shape:'arrowUp',text:'Buy'}); }
    const brkS=S.map(z=>!!z&&z.act&&b.close<z.bot-p.brkAtr*a), brkR=R.map(z=>!!z&&z.act&&b.close>z.top+p.brkAtr*a);
    const flipNew=p.useFlip&&brkR.some(Boolean), fz=flipNew?R[brkR.indexOf(true)]:null;
    S.forEach((z,k)=>{ if(!z) return; z.used=bS[k]?true:(b.high>z.top+p.rearmAtr*a?false:z.used); z.act=z.act&&!brkS[k]&&(i-z.cBar)<=p.maxAge; });
    R.forEach((z,k)=>{ if(!z) return; z.act=z.act&&!brkR[k]&&(i-z.cBar)<=p.maxAge; });
    if(F){ F.used=bF?true:(b.high>F.top+p.rearmAtr*a?false:F.used); F.act=F.act&&b.close>=F.bot-p.brkAtr*a&&(i-F.cBar)<=p.maxAge; }

      const ms=PL.filter((_,k)=>mL[k]), nb=Math.min(lowNew,...ms.map(q=>q.v)), nt=Math.max(lowNew,...ms.map(q=>q.v))+p.zoneThick*a;
      if(!S.some(z=>ovl(z,nt,nb))){ const left=ms.length?ms[ms.length-1].b:j, drop=S[2]; S=[mkZ('S',nt,nb,left,i),S[0],S[1]]; if(drop) drop.dropped=true; } }
    if(newPH&&mH.filter(Boolean).length>=p.minTouches-1){
      const ms=PH.filter((_,k)=>mH[k]), nt=Math.max(highNew,...ms.map(q=>q.v)), nb=Math.min(highNew,...ms.map(q=>q.v))-p.zoneThick*a;
      if(!R.some(z=>ovl(z,nt,nb))){ const left=ms.length?ms[ms.length-1].b:j, drop=R[2]; R=[mkZ('R',nt,nb,left,i),R[0],R[1]]; if(drop) drop.dropped=true; } }
    if(flipNew){ if(F) F.dropped=true; F=mkZ('F',fz.top,fz.bot,i,i); }
    S.concat(R,[F]).forEach(z=>{ if(z&&z.act) z.rBar=i; });
    if(newPL){ PL.unshift({v:lowNew,b:j}); if(PL.length>8) PL.pop(); }
    if(newPH){ PH.unshift({v:highNew,b:j}); if(PH.length>8) PH.pop(); }
  }
  const col={S:'#4caf50',R:'#f44336',F:'#00bcd4'};
  const rects=all.filter(z=>z.kind!=='R'||p.showRes).map(z=>({type:'rect',pts:[{i:z.left,p:z.top},{i:Math.max(z.rBar,z.left+1),p:z.bot}],
    o:{color:col[z.kind],w:1,fill:.18,extL:false,extR:z.act&&!z.dropped,mid:false}}));
  return {mk,rects};
}

async function catchUp(my){

    const bs=BASE_SEC[tf[1]]||2592000, gap=Date.now()/1000-base[base.length-1].time, lim=Math.max(5,Math.min(1000,Math.ceil(gap/bs)+3));
    const res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym[0]}&interval=${tf[1]}&limit=${lim}`); if(!res.ok) return false;
    const rows=await res.json(); if(!Array.isArray(rows)||!rows.length||my!==token) return false;
    const cs=rows.map(toCandle), t0=cs[0].time, replaced=base[base.length-1].time<t0, oldLen=candles.length;
    base=replaced?cs:base.filter(c=>c.time<t0).concat(cs);
    const nc=aggregate(base,tf), a=nc[nc.length-1], b=candles[candles.length-1];
    const changed=replaced||nc.length!==oldLen||!b||!a||a.time!==b.time||a.close!==b.close||a.high!==b.high||a.low!==b.low||a.volume!==b.volume;

      stCount=candles.length; const safe=f=>{ try{ f(); }catch(e){} };

}

    if(CONN.zombie){ CONN.zombie=false; connect(my,true); return; }   // silent socket on a quiet market: swap it without alarming anyone

// once a second: judge the connection, keep the banner honest, poll when the socket is down
setInterval(()=>{
  if(connInReplay()){ connSet('replay'); return; }
  if(CONN.needLoad||(!candles.length&&!base.length)){ connBanner(); return; }
  const now=Date.now();
  if(!navigator.onLine){ offlineMode=true; connSet('offline'); connBanner(); return; }
  if(offlineMode){ resync(); connBanner(); return; }
  const open=ws&&ws.readyState===1, silent=now-connFresh();
  if(open){
    if(CONN.state==='live'&&silent>STALE_MS) connSet('delayed');
    if(silent>VERIFY_MS&&now-CONN.verifyT>VERIFY_MS) verifyFeed();
    if(now-CONN.lastMsg>DEAD_MS){ CONN.zombie=CONN.state==='live'||CONN.state==='delayed'; try{ ws.close(); }catch(e){} }
  } else if((CONN.state==='reconnecting'||CONN.state==='disconnected'||CONN.polling)&&CONN.tries>=2&&now-CONN.pollT>5000) pollFeed();
  connBanner();
},1000);

const _sd=candle.setData.bind(candle), _up=candle.update.bind(candle); let haC=[];
function toHA(a){ const o=[]; a.forEach((c,i)=>{ const cl=(c.open+c.high+c.low+c.close)/4, op=i?(o[i-1].open+o[i-1].close)/2:(c.open+c.close)/2;
  o.push({time:c.time,open:op,high:Math.max(c.high,op,cl),low:Math.min(c.low,op,cl),close:cl}); }); return o; }
function toRenko(a){ if(a.length<20) return a; const at=atrW(a,14); let sz=NaN; for(let i=at.length-1;i>=0;i--){ if(isFinite(at[i])&&at[i]>0){ sz=at[i]; break; } } if(!isFinite(sz)) sz=a[a.length-1].close*.002;
  let last={o:Math.round(a[0].close/sz)*sz,c:0}; last.c=last.o; const br=[];
  a.forEach(c=>{ for(let g=0;g<500;g++){ const up=last.c>=last.o, top=Math.max(last.o,last.c), bot=Math.min(last.o,last.c); let b;
    if(c.close>=top+sz) b=up?{o:last.c,c:last.c+sz}:{o:top,c:top+sz}; else if(c.close<=bot-sz) b=up?{o:bot,c:bot-sz}:{o:last.c,c:last.c-sz}; else break; br.push(b); last=b; } });
  const m=Math.min(br.length,a.length), s=br.slice(br.length-m); // bricks fill the last m candle slots (time axis is approximate)
  return s.map((b,k)=>({time:a[a.length-m+k].time,open:b.o,close:b.c,high:Math.max(b.o,b.c),low:Math.min(b.o,b.c)})); }
candle.setData=arr=>{ _sd(ctype===4?(haC=toHA(arr)):ctype===5?toRenko(arr):arr); };
candle.update=c=>{ const n=candles.length;
  if(ctype===4){ if(!haC.length||haC.length<n-1){ _sd(haC=toHA(candles)); return; } const i=n-1, pv=haC[i-1], cl=(c.open+c.high+c.low+c.close)/4, op=pv?(pv.open+pv.close)/2:(c.open+c.close)/2;
    const h={time:c.time,open:op,high:Math.max(c.high,op,cl),low:Math.min(c.low,op,cl),close:cl}; haC[i]=h; _up(h); }
  else if(ctype===5) _sd(toRenko(candles)); else _up(c); };

#panel.dwx .tile{position:relative;background:#2b2b2b;border:0;border-radius:14px;padding:10px 2px 8px;font-size:11.5px;line-height:1.15;font-weight:600;color:#ececec;gap:6px;min-height:0}
#panel.dwx .tile svg{width:26px;height:26px}
#panel.dwx .tile.util.line{background:transparent;border:1px solid #3d3d3d}
#panel.dwx .tile.util.on{background:rgba(41,98,255,.18);border:1px solid #2962ff;color:#8fb2ff}
#panel.dwx .tile.util.on svg{color:#8fb2ff}
#panel.dwx .dwx-more{position:absolute;right:2px;top:2px;font-size:16px;line-height:1;color:#9a9a9a;padding:3px 4px;background:none;border:0}
#panel.dwx .dwx-search{display:flex;align-items:center;gap:8px;background:#2b2b2b;border-radius:12px;padding:7px 10px;margin:4px 0 2px}
#panel.dwx .dwx-search svg{width:18px;height:18px;color:#aaa;flex:none}
#panel.dwx .dwx-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:#eee;font-size:14px;font-weight:600}
#panel.dwx .tile:active{background:#363636}
#panel.dwx .tile svg{display:block;color:#dcdcdc}
#panel.dwx .tile .dwx-star{position:absolute;right:3px;top:1px;font-size:13px;line-height:1;color:#6b6b6b;padding:3px;background:none;border:0}
#panel.dwx .tile .dwx-star.on{color:#f5b942}
.dwx-empty{color:var(--mut);padding:18px 6px;font-size:14px;line-height:1.5}

  dlg.innerHTML='<div class="cs-card"><div class="cs-h"><h2>Settings</h2><button class="cs-x" aria-label="Close">✕</button></div><div class="cs-b"><div class="cs-nav"></div><div class="cs-c"></div></div><div class="cs-f"><div class="cs-tpl"><button class="cs-tb">Template ▾</button><div class="cs-menu" style="display:none"></div></div><span style="flex:1"></span><button class="cs-cancel">Cancel</button><button class="cs-ok">Ok</button></div></div>';
  const nav=dlg.querySelector('.cs-nav'), box=dlg.querySelector('.cs-c'), menu=dlg.querySelector('.cs-menu');
  const cancel=()=>{ CS=snap; window.mpCS=CS; csSave(); csApply(); dlgClose(); };
  dlg.querySelector('.cs-x').onclick=cancel; dlg.querySelector('.cs-cancel').onclick=cancel; dlg.querySelector('.cs-ok').onclick=()=>{ csSave(); dlgClose(); toast('Settings saved','#2962ff'); };
  dlg.addEventListener('pointerdown',e=>e.stopPropagation()); dlg.addEventListener('mousedown',e=>e.stopPropagation()); dlg.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
  const set=(k,v)=>{ CS[k]=v; window.mpCS=CS; csApply(); };
  const H=t=>box.appendChild($$('div','cs-hd',t));
  const chk=(l,k)=>{ const r=$$('label','cs-r'); const i=$$('input'); i.type='checkbox'; i.checked=!!CS[k]; i.onchange=()=>set(k,i.checked); r.appendChild(i); r.appendChild($$('span','',l)); box.appendChild(r); };
  const eff=k=>{ const P=PRE_(); return CS[k]||P[k]; };
  const PRE_=()=>{ const R=window.mpPal(); return {bodyUp:R.up,bodyDn:R.dn,borUp:R.up,borDn:R.dn,wickUp:R.up,wickDn:R.dn,bg:getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#0b0e14',grid:'#2a3042',cross:'#7c8cff'}; };
  const col=(r,k)=>{ const i=$$('input','cs-col'); i.type='color'; const v=eff(k); i.value=/^#[0-9a-f]{6}$/i.test(v)?v:'#888888'; i.oninput=()=>set(k,i.value); r.appendChild(i); };
  const trio=(l,k,ku,kd)=>{ const r=$$('div','cs-r cs-r2'); const lab=$$('label','cs-l'); const i=$$('input'); i.type='checkbox'; i.checked=CS[k]!==false; i.onchange=()=>set(k,i.checked); lab.appendChild(i); lab.appendChild($$('span','',l)); r.appendChild(lab); col(r,ku); col(r,kd); box.appendChild(r); };
  const sel=(l,k,items,cb)=>{ const r=$$('div','cs-r cs-r2'); r.appendChild($$('span','cs-l',l)); const s=$$('select','cs-sel'); items.forEach(([v,t])=>{ const o=$$('option','',''); o.value=v; o.textContent=t; s.appendChild(o); }); s.value=String(CS[k]); s.onchange=()=>{ set(k,k==='scale'?+s.value:s.value); if(cb) cb(); }; r.appendChild(s); box.appendChild(r); };
  const colRow=(l,k)=>{ const r=$$('div','cs-r cs-r2'); r.appendChild($$('span','cs-l',l)); col(r,k); const b=$$('button','cs-mini','Reset'); b.onclick=()=>{ set(k,''); show(); }; r.appendChild(b); box.appendChild(r); };
  const SEC=[['sym','Symbol','▯▮',()=>{ H('CANDLES'); chk('Color bars based on previous close','colorPrev'); trio('Body','body','bodyUp','bodyDn'); trio('Borders','border','borUp','borDn'); trio('Wick','wick','wickUp','wickDn'); H('DATA MODIFICATION'); sel('Precision','prec',PRECS); sel('Timezone','tz',TZS.map(x=>[x[0],x[1]])); }],
   ['status','Status line','☰',()=>{ H('STATUS LINE'); chk('Title (market and timeframe)','sTitle'); chk('Open, high, low, close','sOhlc'); chk('Volume','sVol'); chk('Change %','sChg'); chk('Indicator names','sInds'); }],
   ['scales','Scales and lines','⇲',()=>{ H('PRICE SCALE'); sel('Scale type','scale',[[0,'Normal'],[1,'Logarithmic'],[2,'Percentage']]); H('LINES AND LABELS'); chk('Last price line','lastLine'); chk('Price tag with countdown','tag'); chk('Grid: horizontal lines','gh'); chk('Grid: vertical lines','gv'); }],
   ['dev','Notifications and screen','🔔',()=>{ H('NOTIFICATIONS'); const pm=notePerm(), r=$$('div','cs-r cs-r2');
      r.appendChild($$('span','cs-l','Alert notifications')); r.appendChild($$('span','cs-pill '+pm,pm==='granted'?'Allowed':pm==='denied'?'Blocked':pm==='unsupported'?'Not supported':'Not asked yet')); box.appendChild(r);
      if(pm==='default'){ const b=$$('button','cs-btn','Allow notifications'); b.onclick=()=>{ Notification.requestPermission().then(()=>show()).catch(()=>show()); }; box.appendChild(b); }
      if(pm==='granted'){ const b=$$('button','cs-btn','Send a test notification'); b.onclick=noteTest; box.appendChild(b); }
      box.appendChild($$('div','cs-note',pm==='denied'?'Notifications are blocked for this site. Open your browser or phone settings for this site, turn Notifications on, then come back.':pm==='unsupported'?'This browser cannot show notifications.':'Your phone or browser will ask for permission. Alerts then show as notifications while the app is open or running in the background. On iPhone this only works after you add the app to your home screen. Alerts that arrive while the app is fully closed need a server, which is not set up yet.'));
      H('SCREEN'); const k=$$('label','cs-r'), ki=$$('input'); ki.type='checkbox'; ki.checked=!!CS.keepOn; ki.disabled=!wlOk; ki.onchange=async()=>{ set('keepOn',ki.checked); if(ki.checked){ const ok=await wlSet(true); if(!ok){ toast('Your browser would not keep the screen on','#ff5d7a'); } } }; k.appendChild(ki); k.appendChild($$('span','','Always keep the screen on')); box.appendChild(k);
      box.appendChild($$('div','cs-note',wlOk?'Stops the screen from dimming or locking while MarketPro View is open. This uses more battery.':'This browser does not support keeping the screen on.')); }],
   ['canvas','Canvas','✎',()=>{ H('APPEARANCE'); sel('Theme','theme',[['dark','Dark'],['light','Light']],()=>{ CS.bg=''; show(); }); colRow('Background','bg'); colRow('Grid lines','grid'); H('CROSSHAIR'); colRow('Colour','cross'); sel('Line style','crossStyle',[['dashed','Dashed'],['solid','Solid'],['dotted','Dotted']]); }]];
  const show=()=>{ nav.innerHTML=''; SEC.forEach(([id,n,ic])=>{ const b=$$('button',id===secId?'on':'','<i>'+ic+'</i><span>'+n+'</span>'); b.onclick=()=>{ secId=id; show(); }; nav.appendChild(b); }); box.innerHTML=''; SEC.find(x=>x[0]===secId)[3](); };
  const menuDraw=()=>{ menu.innerHTML=''; const it=(t,f)=>{ const b=$$('button','',''); b.textContent=t; b.onclick=()=>{ menu.style.display='none'; f(); }; menu.appendChild(b); };
    it('Apply defaults',()=>{ const keep={tz:CS.tz}; CS=Object.assign({},CSD,keep,{theme:CS.theme}); window.mpCS=CS; window.mpSTY.grid=true; window.mpSTY.outline=false; window.mpSTY.preset='default'; csApply(); show(); });
    it('Save as…',()=>{ const n=prompt('Name this template:'); if(!n) return; const o=tplGet(); o[n.trim()]=clone(CS); tplPut(o); toast('Template saved','#2962ff'); });
    const o=tplGet(); Object.keys(o).forEach(n=>it('◇ '+n,()=>{ CS=Object.assign({},CSD,o[n]); window.mpCS=CS; csApply(); show(); })); };
  dlg.querySelector('.cs-tb').onclick=()=>{ menuDraw(); menu.style.display=menu.style.display==='none'?'block':'none'; };
  show(); }
window.mpPal=()=>{ const cs=getComputedStyle(document.documentElement); return {up:(cs.getPropertyValue('--up')||'#2dd4a7').trim(),dn:(cs.getPropertyValue('--dn')||'#ff5d7a').trim()}; };
window.mpSettings=openSettings; window.mpStyleSheet=openSettings;
if(CS.theme||CS.bg||CS.grid||CS.cross||CS.tag===false||CS.sTitle===false||CS.sOhlc===false||CS.sInds===false||CS.prec!=='default'||CS.colorPrev||CS.lastLine===false||CS.gh===false||CS.gv===false||CS.body===false||CS.border===false||CS.wick===false||CS.bodyUp||CS.bodyDn||CS.borUp||CS.borDn||CS.wickUp||CS.wickDn||CS.crossStyle!=='dashed') setTimeout(()=>{ CS.scale=window.mpSTY.scale||0; csApply(); },400);
}catch(err){ console.error('settings dialog failed',err); }

new ResizeObserver(render).observe($('main'));
// ---------- toolbar: essentials on the bar, everything else under More ----------
{
const FIXED=['bSym','bTf','bMore'], DEFAULT=['bInd','bDraw','bAlert'], MAXP=4, mq=window.matchMedia('(min-width:640px)');
const NICE={bInd:['ƒx','Indicators'],bDraw:['✎','Drawings'],bAlert:['⏰','Alerts'],bWatch:['☆','Watchlist'],bBook:['▤','Order book'],bCalc:['⚖','Calculator'],bStrat:['⚑','Strategies'],bType:['▮▯','Chart type'],bClear:['↶','Undo drawing'],bShot:['⤴','Share image'],bFull:['⛶','Fullscreen'],bScan:['⇅','Scanner'],bOv:['◈','Overlays']};
const acts=()=>[].slice.call($('bar').querySelectorAll('button')).filter(b=>b.id&&!FIXED.includes(b.id)).map(b=>({id:b.id,el:b,ic:(NICE[b.id]||[])[0]||b.textContent.trim().slice(0,3),lb:(NICE[b.id]||[])[1]||(b.title||b.id).split(/[:,]/)[0]}));
let pinned=DEFAULT.slice(), undoOn=false, nSeen=0;
try{ const v=JSON.parse(localStorage.getItem('mpBar')); if(Array.isArray(v)) pinned=v.filter(x=>typeof x==='string').slice(0,MAXP); }catch(e){}
const barSave=()=>{ try{ localStorage.setItem('mpBar',JSON.stringify(pinned)); }catch(e){} };
const css=document.createElement('style'); css.textContent=
 '#bar button.hid{display:none}'+
 '@media (max-width:420px){#bar{gap:1px;padding:4px 5px}#bar button{padding:11px 9px}#bar button.txt{padding:11px 10px}}'+
 '@media (max-width:340px){#bar button{padding:11px 7px;font-size:14px}#bar button.txt{padding:11px 8px;font-size:14px}}'+
 '.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 16px}'+
 '.mgrid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:74px;padding:10px 2px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font:600 11.5px/1.15 system-ui;text-align:center}'+
 '.mgrid button b{font-size:21px;font-weight:500;line-height:1;color:var(--txt)}.mgrid button:active{background:rgba(255,255,255,.1)}.mgrid button.pin{border-color:var(--acc);background:rgba(124,140,255,.12)}';
document.head.appendChild(css);
function barApply(){
  const wide=mq.matches, A=acts(); nSeen=A.length;
  A.forEach(a=>{ const k=pinned.indexOf(a.id), show=wide||k>=0||(a.id==='bClear'&&undoOn);
    a.el.classList.toggle('hid',!show); a.el.style.order=wide?'':(a.id==='bClear'&&k<0?90:2+Math.max(0,k)); a.el.setAttribute('aria-label',a.lb); });
  const sp=$('bar').querySelector('.sp'); if(sp) sp.style.order=wide?'':50;
  $('bSym').style.order=wide?'':0; $('bTf').style.order=wide?'':1; $('bMore').style.order=wide?'':100;
  $('bMore').setAttribute('aria-label','More tools');
}
if(mq.addEventListener) mq.addEventListener('change',barApply);
// Undo only takes up room while there is something to undo
setInterval(()=>{ let on=false; try{ on=!!(pending||drawings.length); }catch(e){} if(on!==undoOn||acts().length!==nSeen){ undoOn=on; barApply(); } },400);
function barEdit(){ openSheet('Customize toolbar',()=>{
  const t=document.createElement('div'); t.className='wl-e'; t.style.paddingTop='0';
  t.textContent=`Market and Interval stay on the bar. Pin up to ${MAXP} more tools (${pinned.length} of ${MAXP} used). Everything else is one tap away under ⋯ More.`; groups.appendChild(t);
  const b=chips('');
  acts().forEach(a=>{ const on=pinned.includes(a.id);
    chip(b,(on?'✓ ':'')+a.ic+' '+a.lb,on,()=>{ if(on) pinned=pinned.filter(x=>x!==a.id); else if(pinned.length>=MAXP){ toast(`Only ${MAXP} fit – unpin one first`,'#ff5d7a'); return; } else pinned=pinned.concat(a.id); barSave(); barApply(); barEdit(); }); });
  const r=chips(''); chip(r,'Reset to default',false,()=>{ pinned=DEFAULT.slice(); barSave(); barApply(); barEdit(); },true); chip(r,'← Back to More',false,()=>$('bMore').click(),true); }); }
// More: a labelled grid of every tool that is not on the bar
const _bm=$('bMore').onclick;
$('bMore').onclick=function(){
  if(_bm) _bm.apply(this,arguments);
  if(mq.matches) return;
  const grid=document.createElement('div'); grid.className='mgrid';
  const tile=(ic,lb,fn,cls)=>{ const x=document.createElement('button'); x.type='button'; if(cls) x.className=cls; const i=document.createElement('b'); i.textContent=ic; x.appendChild(i); x.appendChild(document.createTextNode(lb)); x.onclick=fn; grid.appendChild(x); };
  acts().forEach(a=>{ if(pinned.includes(a.id)) return;
    tile(a.ic,a.lb,()=>{ close(); try{ a.el.click(); }catch(e){} }); });
  tile('⚙','Customize toolbar',barEdit,'pin');
  const h=document.createElement('h4'); h.textContent='TOOLS';
  groups.insertBefore(grid,groups.firstChild); groups.insertBefore(h,grid);
};
barApply();
}

restore();
load();
try{ if(typeof shareIntake==='function') shareIntake(); }catch(e){}
}

const SRCS=[
  'https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js',
  'https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js',
  'https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js'
];
function tryLoad(i){
  if(i>=SRCS.length){ document.getElementById('legend').textContent='Chart library blocked – turn off data saver or ad blocker, then reload'; return; }
  const s=document.createElement('script'); s.src=SRCS[i]; s.onload=start; s.onerror=()=>tryLoad(i+1);
  document.head.appendChild(s);
}
tryLoad(0);
</script>
