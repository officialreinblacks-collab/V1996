<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MarketPlusView Admin</title>
<style>
:root{--bg:#0b0e14;--bg2:#10141d;--line:rgba(255,255,255,.08);--txt:#e9edf5;--mut:#7f8aa3;--acc:#7c8cff;--acc2:#a78bfa;--ok:#2dd4a7;--bad:#ff5d7a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 20% -10%,#161c2e 0%,var(--bg) 60%);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 40px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.box{background:linear-gradient(180deg,#171c29,#10141d);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
input{width:100%;background:#151a24;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;margin-bottom:10px;outline:none}
input:focus{border-color:var(--acc)}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
.row{display:flex;gap:10px}.row>div{flex:1}
button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2))}
button.ghost{background:rgba(255,255,255,.07);color:var(--txt)}
button.sm{padding:7px 10px;font-size:13px;border-radius:9px}
button.danger{background:rgba(255,93,122,.18);color:var(--bad)}
.full{width:100%}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;background:rgba(255,255,255,.05);color:var(--mut)}
.tabs button.on{background:rgba(124,140,255,.18);color:var(--txt)}
.msg{font-size:14px;color:var(--bad);min-height:18px;margin-bottom:8px}.msg.ok{color:var(--ok)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.code{font-weight:700;letter-spacing:.05em;font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--mut);margin-top:2px;word-break:break-all}
.acts{display:flex;gap:6px;flex:none}
textarea{width:100%;height:120px;background:#151a24;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font:600 15px ui-monospace,monospace;letter-spacing:.04em;margin:10px 0}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>MarketPlusView Admin</h1>
  <p class="sub" id="who">Sign in with your admin email.</p>

  <div class="box" id="login">
    <input id="e" type="email" inputmode="email" placeholder="Admin email" autocomplete="email">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <div class="msg" id="lm"></div>
    <button class="full" id="go">Sign in</button>
  </div>

  <div id="app" class="hide">
    <div class="tabs"><button data-t="gen" class="on">Generate</button><button data-t="codes">Codes</button><button data-t="mem">Members</button></div>

    <div class="box" id="t-gen">
      <div class="row"><div><label>How many codes</label><input id="n" type="number" min="1" max="50" value="1"></div>
      <div><label>Days of access</label><input id="d" type="number" min="1" max="365" value="30"></div></div>
      <label>Note (optional, e.g. who it is for)</label><input id="note" type="text" placeholder="e.g. John, paid Oct">
      <div class="msg" id="gm"></div>
      <button class="full" id="mk">Generate codes</button>
      <div id="out" class="hide"><textarea id="ta" readonly></textarea><button class="ghost full" id="cp">Copy all</button></div>
    </div>

    <div class="box hide" id="t-codes"><div id="codes"></div></div>
    <div class="box hide" id="t-mem"><div id="mem"></div></div>
    <button class="ghost full" id="so">Sign out</button>
  </div>
</div>

<script>
var SB_URL='https://ssukfrvtknfsccqxqkjh.supabase.co', SB_KEY='sb_publishable_qjmaCvag0XhnMlipWFHCeA_fwt3CqST', sb;
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var fd=function(t){return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})};
function say(id,t,ok){var m=$(id);m.textContent=t||'';m.className='msg'+(ok?' ok':'')}

async function enter(){
  var s=(await sb.auth.getSession()).data.session;
  if(!s){$('login').classList.remove('hide');$('app').classList.add('hide');return}
  var a=await sb.rpc('is_admin');
  if(a.error||a.data!==true){$('who').textContent='Signed in as '+s.user.email+' (not an admin)';$('login').classList.add('hide');$('app').classList.add('hide');$('login').insertAdjacentHTML('beforebegin','<div class="box" id="na"><div class="msg">This account is not an admin. Sign out and use the admin email.</div><button class="ghost full" onclick="out()">Sign out</button></div>');return}
  var n=$('na');if(n)n.remove();
  $('who').textContent='Signed in as '+s.user.email;$('login').classList.add('hide');$('app').classList.remove('hide');
  loadCodes();loadMem();
}
async function out(){await sb.auth.signOut();location.reload()}

function code(){var A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',b=new Uint8Array(8);crypto.getRandomValues(b);var c='';b.forEach(function(x){c+=A[x%A.length]});return'MPV-'+c.slice(0,4)+'-'+c.slice(4)}

async function loadCodes(){
  var r=await sb.from('access_codes').select('*').order('created_at',{ascending:false}).limit(200);
  var el=$('codes');if(r.error){el.innerHTML='<div class="msg">'+esc(r.error.message)+'</div>';return}
  if(!r.data.length){el.innerHTML='<div class="empty">No codes yet. Generate some first.</div>';return}
  el.innerHTML=r.data.map(function(c){var used=!!c.redeemed_by;
    return'<div class="item"><div><div class="code">'+esc(c.code)+'</div><div class="meta">'+c.days+' days · '+(used?'Used by '+esc(c.redeemed_email)+' on '+fd(c.redeemed_at):'Unused')+(c.note?' · '+esc(c.note):'')+'</div></div>'+
    '<div class="acts"><button class="sm ghost" data-copy="'+esc(c.code)+'">Copy</button>'+(used?'':'<button class="sm danger" data-del="'+esc(c.code)+'">Delete</button>')+'</div></div>'}).join('');
}
async function loadMem(){
  var r=await sb.from('memberships').select('*').order('expires_at',{ascending:false});
  var el=$('mem');if(r.error){el.innerHTML='<div class="msg">'+esc(r.error.message)+'</div>';return}
  if(!r.data.length){el.innerHTML='<div class="empty">No members yet.</div>';return}
  el.innerHTML=r.data.map(function(m){var on=new Date(m.expires_at)>new Date();
    return'<div class="item"><div><div class="code" style="letter-spacing:0">'+esc(m.email)+'</div><div class="meta">'+(on?'Active until ':'Expired ')+fd(m.expires_at)+'</div></div>'+
    '<div class="acts"><button class="sm ghost" data-ext="'+m.user_id+'" data-exp="'+m.expires_at+'">+30d</button><button class="sm danger" data-rev="'+m.user_id+'">Revoke</button></div></div>'}).join('');
}

document.addEventListener('click',async function(ev){
  var t=ev.target.closest('button');if(!t)return;
  if(t.dataset.t){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b===t)});['gen','codes','mem'].forEach(function(k){$('t-'+k).classList.toggle('hide',k!==t.dataset.t)});if(t.dataset.t==='codes')loadCodes();if(t.dataset.t==='mem')loadMem();return}
  if(t.dataset.copy){try{await navigator.clipboard.writeText(t.dataset.copy);t.textContent='Copied';setTimeout(function(){t.textContent='Copy'},1200)}catch(e){}return}
  if(t.dataset.del){if(!confirm('Delete code '+t.dataset.del+'?'))return;await sb.from('access_codes').delete().eq('code',t.dataset.del);loadCodes();return}
  if(t.dataset.rev){if(!confirm('Remove this member\'s access?'))return;await sb.from('memberships').delete().eq('user_id',t.dataset.rev);loadMem();return}
  if(t.dataset.ext){var base=Math.max(Date.now(),new Date(t.dataset.exp).getTime());await sb.from('memberships').update({expires_at:new Date(base+30*864e5).toISOString()}).eq('user_id',t.dataset.ext);loadMem();return}
});

function init(){
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  $('go').onclick=async function(){
    var r=await sb.auth.signInWithPassword({email:$('e').value.trim(),password:$('p').value});
    if(r.error)return say('lm',r.error.message);enter();
  };
  $('so').onclick=out;
  $('mk').onclick=async function(){
    var n=Math.min(50,Math.max(1,+$('n').value||1)),d=Math.min(365,Math.max(1,+$('d').value||30)),note=$('note').value.trim()||null,rows=[];
    for(var i=0;i<n;i++)rows.push({code:code(),days:d,note:note});
    var r=await sb.from('access_codes').insert(rows);
    if(r.error)return say('gm',r.error.message);
    say('gm',n+' code'+(n>1?'s':'')+' created.',true);
    $('ta').value=rows.map(function(x){return x.code}).join('\n');$('out').classList.remove('hide');loadCodes();
  };
  $('cp').onclick=async function(){try{await navigator.clipboard.writeText($('ta').value);$('cp').textContent='Copied'}catch(e){$('ta').select()}setTimeout(function(){$('cp').textContent='Copy all'},1200)};
  enter();
}
(function load(i){var S=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'];
  if(i>=S.length){$('who').textContent='Could not load the sign-in library. Turn off your ad blocker and reload.';return}
  var s=document.createElement('script');s.src=S[i];s.onload=init;s.onerror=function(){load(i+1)};document.head.appendChild(s)})(0);
</script>
</body>
</html>
